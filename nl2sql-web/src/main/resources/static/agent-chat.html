<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 数据助手</title>
    <!-- ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Microsoft YaHei', Arial, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            /* ✅ 移除固定高度和flex布局，由index.html注入样式控制 */
        }
        
        .chat-container {
            width: 90%;
            max-width: 1200px;
            height: calc(100vh - 40px); /* ✅ 固定高度 */
            min-height: calc(100vh - 60px);
            margin: 20px auto; /* ✅ 居中显示 */
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        /* 头部 */
        .chat-header {
            padding: 20px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .chat-header h2 {
            font-size: 20px;
            font-weight: 600;
        }
        
        .user-info {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        
        .nav-btn {
            padding: 8px 16px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        
        .nav-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }
        
        /* 消息区域 */
        .chat-messages {
            flex: 1; /* ✅ 占据剩余空间 */
            overflow-y: auto;
            padding: 24px;
            background: #f8f9fa;
            min-height: 0; /* ✅ 允许收缩 */
        }
        
        .message {
            margin-bottom: 20px;
            display: flex;
            animation: fadeIn 0.3s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message.user {
            justify-content: flex-end;
        }
        
        .message.agent {
            justify-content: flex-start;
        }
        
        .message-bubble {
            max-width: 70%;
            padding: 14px 18px;
            border-radius: 12px;
            line-height: 1.6;
            font-size: 14px;
        }
        
        .message.user .message-bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }
        
        .message.agent .message-bubble {
            background: white;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            max-width: 95%;  /* 增加 Agent 消息最大宽度 */
        }
        
        /* 数据表格 */
        .data-table {
            margin-top: 12px;
            overflow-x: auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        
        .data-table table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        
        .data-table th, .data-table td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .data-table th {
            background: #f5f7fa;
            font-weight: 600;
            color: #555;
        }
        
        .data-table tr:hover {
            background: #f9f9f9;
        }
        
        /* AI 总结 */
        .ai-summary {
            margin-top: 12px;
            padding: 14px;
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            border-left: 4px solid #4caf50;
            border-radius: 6px;
            font-size: 14px;
            line-height: 1.6;
        }
        
        .ai-summary strong {
            color: #2e7d32;
        }
        
        /* 图表容器 */
        .chart-container {
            margin-top: 16px;
            padding: 16px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            width: 100% !important;
            max-width: none !important;  /* 突破 message-bubble 的 70% 限制 */
            min-width: 600px;  /* 最小宽度保证 */
        }
        
        .chart-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid #667eea;
        }
        
        .chart-wrapper {
            width: 100%;
            height: 400px;
            margin-top: 12px;
        }
        
        /* 追问建议按钮 */
        .follow-up-suggestions {
            margin-top: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .suggestion-btn {
            padding: 8px 14px;
            background: white;
            border: 1px solid #667eea;
            color: #667eea;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        
        .suggestion-btn:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102,126,234,0.3);
        }
        
        /* 澄清选择 */
        .clarification-options {
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .clarification-btn {
            padding: 12px 16px;
            background: white;
            border: 2px solid #667eea;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .clarification-btn:hover {
            background: #667eea;
            color: white;
            transform: translateX(5px);
        }
        
        /* 输入区域 */
        .chat-input-area {
            padding: 20px 24px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 12px;
            flex-shrink: 0; /* ✅ 防止被压缩 */
        }
        
        .chat-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 24px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        
        .chat-input:focus {
            border-color: #667eea;
        }
        
        .send-btn {
            padding: 12px 28px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        .send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102,126,234,0.4);
        }
        
        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        /* 加载动画 */
        .typing-indicator {
            display: inline-flex;
            gap: 4px;
            padding: 8px 12px;
        }
        
        .typing-dot {
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }
        
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }
        
        /* SQL 展示 */
        .sql-display {
            margin-top: 12px;
            padding: 12px;
            background: #2d2d2d;
            color: #f8f8f2;
            border-radius: 6px;
            font-family: 'Consolas', monospace;
            font-size: 13px;
            overflow-x: auto;
        }
        
        /* ✅ SQL反馈评分样式 */
        .rating-stars {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        
        .star-btn {
            font-size: 24px;
            cursor: pointer;
            transition: all 0.2s;
            opacity: 0.5;
        }
        
        .star-btn:hover {
            opacity: 1;
            transform: scale(1.2);
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <!-- 头部 -->
        <div class="chat-header">
            <h2>🤖 AI 数据助手</h2>
            <div class="user-info" id="userInfo">加载中...</div>
        </div>
        
        <!-- 消息区域 -->
        <div class="chat-messages" id="chatMessages">
            <div class="message agent">
                <div class="message-bubble">
                    👋 你好！我是你的 AI 数据助手。<br><br>
                    你可以用自然语言问我任何数据问题，例如：<br>
                    • "帮我查最近7天的订单"<br>
                    • "统计每个地区的销售额"<br>
                    • "查看用户增长趋势"<br><br>
                    我会自动执行查询、生成图表并给出分析总结。
                </div>
            </div>
        </div>
        
        <!-- 输入区域 -->
        <div class="chat-input-area">
            <input type="text" class="chat-input" id="chatInput" 
                   placeholder="输入你的问题..." 
                   onkeypress="if(event.key==='Enter') sendMessage()">
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">发送</button>
        </div>
    </div>
    
    <script>
        const token = localStorage.getItem('token');
        const userInfo = JSON.parse(localStorage.getItem('userInfo') || '{}');
        let sessionId = 'session_' + Date.now();
        let currentContext = null;  // 当前会话上下文
        let pendingDatasourceId = null;  // 待确认的数据源ID（用于智能推荐）
        let pendingQuery = null;  // ✅ 待执行的原始查询（数据源澄清时保存）
        let pendingDatasourceList = [];  // ✅ 待选择的数据源列表（用于自然语言选择）
        let isRelationshipClarifying = false;  // 是否处于关联关系澄清状态
        
        // 初始化
        window.onload = function() {
            document.getElementById('userInfo').textContent = `当前用户: ${userInfo.username || '未知'}`;
            document.getElementById('chatInput').focus();
        };
        
        // ✅ 新增：统一的 fetch 封装，自动处理 401 Token 过期
        async function authenticatedFetch(url, options = {}) {
            try {
                const response = await fetch(url, options);
                
                // ✅ 检查 Token 是否过期（401 未授权）
                if (response.status === 401) {
                    console.warn('⚠️ Token 已过期，跳转到登录页');
                    localStorage.removeItem('token');
                    localStorage.removeItem('userInfo');
                    window.location.href = '/login.html';
                    return null; // 阻止后续处理
                }
                
                return response;
            } catch (error) {
                console.error('❌ 网络请求失败:', error);
                throw error;
            }
        }
        
        // 发送消息
        async function sendMessage(customMessage = null) {
            const input = document.getElementById('chatInput');
            const message = customMessage || input.value.trim();
            
            if (!message) return;
            
            // ✅ 关键修复：在发送消息时就保存原始query（用于数据源澄清后重新发送）
            if (!customMessage && !currentContext?.datasourceId) {
                // 只有用户手动输入且未选择数据源时才保存
                pendingQuery = message;
                console.log('[sendMessage] 保存pendingQuery:', pendingQuery);
            }
            
            // ✅ 新增：检测自然语言选择数据源（如“我选第一个”、“选第二个”）
            if (pendingDatasourceList.length > 0) {
                const match = message.match(/(?:选|选择|第)([\d一二三四五六七八九十]+)/);
                if (match) {
                    const indexStr = match[1];
                    let index = parseInt(indexStr) - 1; // “第一个” -> index 0
                    
                    // 处理中文数字
                    const chineseNumbers = {'一':0, '二':1, '三':2, '四':3, '五':4, '六':5, '七':6, '八':7, '九':8, '十':9};
                    if (chineseNumbers[indexStr] !== undefined) {
                        index = chineseNumbers[indexStr];
                    }
                    
                    if (index >= 0 && index < pendingDatasourceList.length) {
                        const selected = pendingDatasourceList[index];
                        console.log('[sendMessage] 检测到自然语言选择:', index+1, selected.name);
                        
                        // 直接调用selectDatasource，不经过正常流程
                        addMessage(message, 'user');
                        input.value = '';
                        showTypingIndicator();
                        setTimeout(() => {
                            selectDatasource(selected.id, selected.name);
                        }, 500);
                        return; // 终止正常流程
                    }
                }
                
                // ✅ 如果用户输入的不是选择指令，视为放弃当前澄清，开始新查询
                console.log('[sendMessage] 检测到新查询，清空数据源列表');
                pendingDatasourceList = [];
                if (window.datasourceListTimeout) {
                    clearTimeout(window.datasourceListTimeout);
                    window.datasourceListTimeout = null;
                }
            }
            
            // ✅ 新查询时清除之前的追问状态
            followUpState.containerId = null;
            followUpState.availableActions = [];
            
            // 显示用户消息
            addMessage(message, 'user');
            input.value = '';
            
            // 显示加载动画
            showTypingIndicator();
            
            try {
                const response = await authenticatedFetch('/api/agent/chat', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': token 
                    },
                    body: JSON.stringify({
                        message: message,
                        sessionId: sessionId,
                        datasourceId: currentContext?.datasourceId || null  // ✅ 传递当前上下文中的数据源ID
                    })
                });
                
                if (!response) return; // Token过期，已跳转
                
                const result = await response.json();
                removeTypingIndicator();
                
                if (result.code === 200 && result.data) {
                    handleAgentResponse(result.data);
                } else {
                    addMessage(`❌ 错误: ${result.message || '请求失败'}`, 'agent');
                }
                
            } catch (error) {
                removeTypingIndicator();
                addMessage(`❌ 网络错误: ${error.message}`, 'agent');
            }
        }
        
        // 处理 Agent 响应
        async function handleAgentResponse(data) {
            console.log('[Agent响应] ========== 开始处理 ==========');
            console.log('[Agent响应] 完整数据:', JSON.stringify(data, null, 2));
            console.log('[Agent响应] status:', data.status);
            console.log('[Agent响应] message:', data.message);
            console.log('[Agent响应] clarificationType:', data.clarificationType);
            console.log('[Agent响应] data字段:', data.data ? `有${data.data.length}条` : '无');
            console.log('[Agent响应] generatedSQL:', data.generatedSQL || data.sql || '无');
            console.log('[Agent响应] success:', data.success);
            
            // ⚠️ 重要：保留原有的 sql/generatedSQL，只更新其他字段
            const preservedFields = ['sql', 'generatedSQL'];
            const preservedData = {};
            preservedFields.forEach(field => {
                if (currentContext && currentContext[field]) {
                    preservedData[field] = currentContext[field];
                }
            });
            
            currentContext = { ...data, ...preservedData };
            
            // ✅ 关键修复：如果响应中包含 datasourceId，保存到上下文
            if (data.datasourceId) {
                currentContext.datasourceId = data.datasourceId;
            }
            
            // ✅ 关键修复：确保 data 字段被正确保存（用于图表和Excel下载）
            if (data.data && Array.isArray(data.data)) {
                currentContext.data = data.data;
                console.log('[Agent响应] 已保存 data 字段:', data.data.length, '条记录');
            }
            
            // 保存最后一次的查询问题（用于AI总结等场景）
            const lastUserMessage = document.querySelector('.message.user:last-child .message-bubble');
            if (lastUserMessage) {
                currentContext.lastQuery = lastUserMessage.textContent.trim();
            }
            
            // ✅ 兼容 forceExecuteQuery 返回的格式（有 success 但没有 status）
            if (!data.status && data.success !== undefined) {
                data.status = data.success ? 'success' : 'error';
                if (data.error && !data.message) {
                    data.message = data.error;
                }
            }
            
            switch(data.status) {
                case 'sql_generated':
                    handleSQLGenerated(data);
                    break;
                    
                case 'success':
                    await handleQuerySuccess(data);
                    break;
                    
                case 'clarification_needed':
                    handleClarification(data);
                    break;
                    
                case 'chart_generated':
                    handleChartGenerated(data);
                    break;
                    
                case 'chart_recommendation':
                    handleChartRecommendation(data);
                    break;
                    
                case 'error':
                    let errorHtml = `❌ ${data.error}`;
                    
                    // ✅ 如果有优化建议，也显示出来（高风险 SQL 阻断时）
                    if (data.optimizationSuggestion) {
                        console.log('[错误响应] 检测到 optimizationSuggestion:', data.optimizationSuggestion);
                        errorHtml += `<br><br><div class="ai-summary" style="background:linear-gradient(135deg, #fff3e0 0%, #ffe0b2 100%);border-left-color:#ff9800;">
                            <strong>💡 优化建议:</strong><br>
                            ${escapeHtml(data.optimizationSuggestion).replace(/\n/g, '<br>')}
                        </div>`;
                        
                        // 如果有优化后的 SQL，显示出来
                        if (data.sql) {
                            errorHtml += `<div class="sql-display" style="margin-top:10px;"><strong>🔧 LLM 优化后的 SQL:</strong><br>${escapeHtml(data.sql)}</div>`;
                        }
                    }
                    
                    addMessage(errorHtml, 'agent');
                    break;
                    
                default:
                    console.warn('[Agent响应] 未知状态:', data.status);
                    addMessage(data.agentReply || data.message || '未知响应', 'agent');
            }
        }
        
        // 处理 SQL 生成完成
        function handleSQLGenerated(data) {
            let html = '';
            
            // 显示 SQL
            if (data.generatedSQL || data.sql) {
                const sqlToDisplay = data.generatedSQL || data.sql;
                html += `<div class="sql-display"><strong>📝 生成的 SQL:</strong><br>${escapeHtml(sqlToDisplay)}</div>`;
            }
            
            if (data.followUpSuggestions && data.followUpSuggestions.length > 0) {
                console.log('[SQL生成-追问建议] 数据结构:', data.followUpSuggestions);
                html += '<div class="follow-up-suggestions">';
                data.followUpSuggestions.forEach((suggestion, index) => {
                    console.log('[SQL生成-追问建议] 第' + index + '个:', suggestion);
                    // 存储追问数据到全局变量
                    window.suggestionData = window.suggestionData || {};
                    
                    // 兼容两种格式：对象数组和字符串数组
                    let suggestionObj;
                    let buttonText;
                    
                    if (typeof suggestion === 'string') {
                        // 字符串数组格式
                        suggestionObj = { text: suggestion, action: 'default' };
                        buttonText = suggestion;
                    } else {
                        // 对象数组格式
                        suggestionObj = suggestion;
                        buttonText = suggestion.text || suggestion;
                    }
                    
                    window.suggestionData[index] = suggestionObj;
                    html += `<button class="suggestion-btn" onclick="handleSuggestionClick(${index})">${escapeHtml(buttonText)}</button>`;
                });
                html += '</div>';
            }
            
            addMessage(html, 'agent');
        }
        
        // 处理查询成功
        async function handleQuerySuccess(data) {
            console.log('[handleQuerySuccess] 完整 data:', data);
            console.log('[handleQuerySuccess] data.data:', data.data);
            console.log('[handleQuerySuccess] data.data 类型:', Array.isArray(data.data) ? 'Array' : typeof data.data);
            console.log('[handleQuerySuccess] data.data 长度:', Array.isArray(data.data) ? data.data.length : 'N/A');
            
            let html = '';
            
            // 情况1：AI总结结果（有 summary 但没有 data）
            if (data.summary && !data.data) {
                console.log('[AI总结] 检测到 summary:', data.summary);
                const formattedSummary = formatAISummary(data.summary);
                html += `<div class="ai-summary"><strong>🤖 AI 智能总结:</strong><br>${formattedSummary}</div>`;
                addMessage(html, 'agent');
                
                // ✅ AI总结后，重新渲染剩余追问按钮（基于原始查询数据）
                if (currentContext && currentContext.data && Array.isArray(currentContext.data) && currentContext.data.length > 0) {
                    const followUpHtml = renderRemainingFollowUpHints('summary');
                    if (followUpHtml) {
                        addMessage(followUpHtml, 'agent');
                    }
                }
                return;
            }
            
            // 情况2：普通查询结果（有 data 字段）
            // 显示 SQL
            if (data.generatedSQL || data.sql) {
                const sqlToDisplay = data.generatedSQL || data.sql;
                html += `<div class="sql-display"><strong>📝 执行的 SQL:</strong><br>${escapeHtml(sqlToDisplay)}</div>`;
            }
            
            // ✅ 新增：显示优化建议/风险原因
            if (data.optimizationSuggestion) {
                console.log('[优化建议] 检测到 optimizationSuggestion:', data.optimizationSuggestion);
                html += `<div class="ai-summary" style="background:linear-gradient(135deg, #fff3e0 0%, #ffe0b2 100%);border-left-color:#ff9800;">
                    <strong>💡 优化建议:</strong><br>
                    ${escapeHtml(data.optimizationSuggestion).replace(/\n/g, '<br>')}
                </div>`;
            }
            
            // ✅ 显示数据表格（await异步渲染）
            if (data.data && Array.isArray(data.data) && data.data.length > 0) {
                console.log('[handleQuerySuccess] 开始渲染表格，记录数:', data.data.length);
                html += await renderDataTable(data.data);
                html += `<div style="margin-top:8px;font-size:13px;color:#666;">✅ 共 ${data.rowCount || data.data.length} 条记录，耗时 ${(data.executionTime || 0).toFixed(2)}秒</div>`;
                console.log('[handleQuerySuccess] 表格渲染完成');
            } else if (data.data && Array.isArray(data.data) && data.data.length === 0) {
                // 查询成功但没有数据
                console.log('[handleQuerySuccess] 查询成功但无数据');

        // ✅ 新增：渲染动态追问提示（DeepSeek风格）
        function renderDynamicFollowUpHints(data) {
            if (!data.data || !Array.isArray(data.data) || data.data.length === 0) {
                return null;
            }
            
            const sql = data.generatedSQL || data.sql || '';
            const isStatistical = isStatisticalData(sql);
            const hasNumeric = hasNumericColumn(data.data);
            
            // ✅ 生成唯一ID用于后续删除
            const containerId = 'follow-up-' + Date.now();
            
            // ✅ 初始化追问状态
            followUpState.containerId = containerId;
            followUpState.availableActions = [];
            if (isStatistical) followUpState.availableActions.push('summary');
            if (isStatistical && hasNumeric && data.data.length >= 2) followUpState.availableActions.push('chart');
            followUpState.availableActions.push('download');
            
            let html = `<div class="follow-up-hints" id="${containerId}" style="margin-top:15px;padding:12px;background:#f0f7ff;border-radius:8px;border-left:3px solid #2196f3;">`;

            html += '<div style="display:flex;gap:8px;flex-wrap:wrap;">';
            
            // 规则1：只有统计数据才提供 AI 总结
            if (isStatistical) {
                html += `<button class="suggestion-btn" onclick="triggerAISummary('${containerId}')">🤖 AI总结</button>`;
            }
            
            // 规则2：统计数据 + 有数值字段，才提供图表生成
            if (isStatistical && hasNumeric && data.data.length >= 2) {
                html += `<button class="suggestion-btn" onclick="triggerChartGeneration('${containerId}')">📊 生成图表</button>`;
            }
            
            // 规则3：只要有数据就提供下载
            html += `<button class="suggestion-btn" onclick="triggerExcelDownload('${containerId}')">💾 下载Excel</button>`;
            
            html += '</div></div>';
            return html;
        }
        
        // 判断是否为统计数据（与后端逻辑一致）
        function isStatisticalData(sql) {
            if (!sql) return false;
            const upperSql = sql.toUpperCase();
            return upperSql.includes('GROUP BY') ||
                   upperSql.includes('COUNT(') ||
                   upperSql.includes('SUM(') ||
                   upperSql.includes('AVG(') ||
                   upperSql.includes('MAX(') ||
                   upperSql.includes('MIN(');
        }
        
        // ✅ 删除追问提示容器
        function removeFollowUpHints(containerId) {
            if (!containerId) return;
            const container = document.getElementById(containerId);
            if (container) {
                container.remove();
                console.log('[追问提示] 已删除:', containerId);
            }
        }
        
        // ✅ 渲染剩余追问按钮（AI总结/图表后调用）
        function renderRemainingFollowUpHints(completedAction) {
            if (!currentContext || !currentContext.data || !Array.isArray(currentContext.data) || currentContext.data.length === 0) {
                return null;
            }
            
            const sql = currentContext.sql || currentContext.generatedSQL || '';
            const isStatistical = isStatisticalData(sql);
            const hasNumeric = hasNumericColumn(currentContext.data);
            
            const containerId = 'follow-up-' + Date.now();
            let html = `<div class="follow-up-hints" id="${containerId}" style="margin-top:15px;padding:12px;background:#f0f7ff;border-radius:8px;border-left:3px solid #2196f3;">`;

            html += '<div style="display:flex;gap:8px;flex-wrap:wrap;">';
            
            // completedAction='summary' → AI总结已完成，不显示
            // completedAction='chart' → 图表已完成，不显示
            
            if (completedAction !== 'summary' && isStatistical) {
                html += `<button class="suggestion-btn" onclick="triggerAISummary('${containerId}')">🤖 AI总结</button>`;
            }
            
            if (completedAction !== 'chart' && isStatistical && hasNumeric && currentContext.data.length >= 2) {
                html += `<button class="suggestion-btn" onclick="triggerChartGeneration('${containerId}')">📊 生成图表</button>`;
            }
            
            // ✅ 始终显示下载Excel
            html += `<button class="suggestion-btn" onclick="triggerExcelDownload('${containerId}')">💾 下载Excel</button>`;
            
            html += '</div></div>';
            return html;
        }
        
        // 检查数据是否包含数值字段
        function hasNumericColumn(data) {
            if (!data || data.length === 0) return false;
            
            const firstRow = data[0];
            for (const value of Object.values(firstRow)) {
                if (typeof value === 'number') return true;
                if (typeof value === 'string') {
                    if (!isNaN(parseFloat(value)) && isFinite(value)) return true;
                }
            }
            return false;
        }

        // 渲染数据表格
        async function renderDataTable(data) {
            if (!data || !Array.isArray(data) || data.length === 0) return '';
            
            const columns = Object.keys(data[0]);
            
            // 检测是否有英文列名需要翻译
            const englishColumns = columns.filter(col => col && !/[\u4e00-\u9fa5]/.test(col));
            
            let columnTranslations = {};
            if (englishColumns.length > 0) {
                try {
                    // 调用后端LLM翻译（带超时保护）
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 3000); // 3秒超时
                    
                    const response = await authenticatedFetch('/api/translate/column-names', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify(englishColumns),
                        signal: controller.signal
                    });
                    
                    clearTimeout(timeoutId);
                    const result = await response.json();
                    if (result.code === 200) {
                        columnTranslations = result.data;
                    }
                } catch (error) {
                    console.warn('翻译失败，使用默认格式化:', error);
                    // 翻译失败不影响表格显示，继续使用默认格式化
                }
            }
            
            let html = '<div class="data-table"><table><thead><tr>';
            
            columns.forEach(col => {
                // 优先使用翻译结果，否则使用通用格式化
                const displayName = columnTranslations[col] || translateColumnName(col);
                html += `<th>${escapeHtml(displayName)}</th>`;
            });
            
            html += '</tr></thead><tbody>';
            
            data.slice(0, 50).forEach(row => {
                html += '<tr>';
                columns.forEach(col => {
                    const value = row[col];
                    let displayValue;
                    if (value === null || value === undefined) {
                        displayValue = '<em style="color:#999;">NULL</em>';
                    } else {
                        displayValue = escapeHtml(String(value));
                    }
                    html += `<td>${displayValue}</td>`;
                });
                html += '</tr>';
            });
            
            html += '</tbody></table></div>';
            
            if (data.length > 50) {
                html += `<div style="margin-top:8px;font-size:13px;color:#999;">仅显示前50条，共${data.length}条</div>`;
            }
            
            return html;
        }
        
        // 智能翻译列名（通用规则，不依赖业务字段）
        function translateColumnName(colName) {
            if (!colName) return colName;
            
            // 如果包含中文，直接返回
            if (/[\u4e00-\u9fa5]/.test(colName)) {
                return colName;
            }
            
            // 尝试将下划线/驼峰命名转换为更易读的形式
            // total_amount -> Total Amount
            // createdAt -> Created At
            let readable = colName
                .replace(/_/g, ' ')  // 下划线转空格
                .replace(/([a-z])([A-Z])/g, '$1 $2');  // 驼峰转空格
            
            // 首字母大写
            readable = readable.replace(/\b\w/g, l => l.toUpperCase());
            
            // 如果转换后和原样差别不大，保持原样
            if (readable.toLowerCase() === colName.toLowerCase()) {
                return colName;
            }
            
            return readable;
        }
        
        // 下载 Excel
        function downloadExcel(data, filename) {
            if (!data || data.length === 0) {
                addMessage('❌ 没有数据可下载', 'agent');
                return;
            }
            
            // 构造 CSV
            const columns = Object.keys(data[0]);
            let csv = columns.join(',') + '\n';
            
            data.forEach(row => {
                const values = columns.map(col => {
                    const value = row[col] !== null && row[col] !== undefined ? row[col] : '';
                    return `"${String(value).replace(/"/g, '""')}"`;
                });
                csv += values.join(',') + '\n';
            });
            
            // 创建下载链接
            const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            link.click();
            
            addMessage(`✅ 已下载 ${filename}`, 'agent');
        }

        // HTML 转义

        // 格式化 AI 总结（将 Markdown 转换为 HTML）
        function formatAISummary(text) {
            if (!text) return '';
            
            let formatted = escapeHtml(text);
            
            // 0. 在数字列表前添加换行（处理没有换行符的情况）
            // 匹配 "数字. " 或 "数字.**" 的模式，在前面添加换行
            formatted = formatted.replace(/(\s)(\d+\.\s+\*\*)/g, '$1<br>$2');
            formatted = formatted.replace(/(\s)(\d+\.\s+[\u4e00-\u9fa5])/g, '$1<br>$2');
            
            // 1. 处理加粗：**text** → <strong>text</strong>
            formatted = formatted.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            
            // 2. 处理数字列表：1. text → <div style="margin:8px 0;"><strong>1.</strong> text</div>
            formatted = formatted.replace(/(\d+)\.\s+(.+?)(?=<br>\d+\.|$)/g, (match, num, content) => {
                return `<div style="margin:10px 0;padding-left:8px;"><strong>${num}.</strong> ${content.trim()}</div>`;
            });
            
            // 3. 处理破折号列表：- text → <div style="margin:5px 0;padding-left:20px;">• text</div>
            formatted = formatted.replace(/[-•]\s+(.+?)(?=<br>[-•]|<br>|$)/g, (match, content) => {
                return `<div style="margin:5px 0;padding-left:24px;">• ${content.trim()}</div>`;
            });
            
            // 4. 处理换行符
            formatted = formatted.replace(/\n/g, '<br>');
            
            return formatted;
        }

            if (config.type === 'bar') {
                option = buildBarChartOption(config);
            } else if (config.type === 'line') {
                option = buildLineChartOption(config);
            } else if (config.type === 'pie') {
                option = buildPieChartOption(config);
            } else if (config.type === 'area') {
                option = buildAreaChartOption(config);
            } else {
                // 默认柱状图
                option = buildBarChartOption(config);
            }
            
            chart.setOption(option);
            
            // 响应式
            window.addEventListener('resize', () => {
                chart.resize();
            });
        }

                },
                tooltip: { trigger: 'axis' },
                xAxis: {
                    type: 'category',
                    data: config.categories || [],
                    axisLabel: { rotate: 45 }
                },
                yAxis: { type: 'value' },
                series: [{
                    type: 'line',
                    data: config.values || [],
                    smooth: config.smooth !== false,
                    lineStyle: { color: '#667eea', width: 3 },
                    areaStyle: config.type === 'area' ? {
                        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                            { offset: 0, color: 'rgba(102,126,234,0.3)' },
                            { offset: 1, color: 'rgba(102,126,234,0.05)' }
                        ])
                    } : null,
                    itemStyle: { color: '#667eea' }
                }]
            };
        }
        
        // 构建面积图配置（复用折线图）
        function buildAreaChartOption(config) {
            return buildLineChartOption(config);
        }
        
        // 构建饼图配置
        function buildPieChartOption(config) {
            return {
                title: {
                    text: config.title || '饼图',
                    left: 'center',
                    textStyle: { fontSize: 16 }
                },
                tooltip: { trigger: 'item' },
                legend: {
                    orient: 'vertical',
                    left: 'left'
                },
                series: [{
                    type: 'pie',
                    radius: '60%',
                    data: config.data || [],
                    emphasis: {
                        itemStyle: {
                            shadowBlur: 10,
                            shadowOffsetX: 0,
                            shadowColor: 'rgba(0, 0, 0, 0.5)'
                        }
                    },
                    label: { show: true, formatter: '{b}: {c}' }
                }]
            };
        }
        
        // ✅ 新增：渲染SQL反馈评分按钮
        function renderFeedbackButtons(question, sql) {
            const feedbackId = 'feedback_' + Date.now();
            let html = '<div class="feedback-container" style="margin-top:15px;padding:12px;background:#f9f9f9;border-radius:8px;border-left:3px solid #667eea;">';
            html += '<div style="font-size:13px;color:#666;margin-bottom:8px;">👍 SQL质量评分（可选，不评默认为3星）</div>';
            html += '<div class="rating-stars" id="' + feedbackId + '">';
            
            for (let i = 1; i <= 5; i++) {
                html += `<span class="star-btn" onclick="handleStarClick('${feedbackId}', ${i}, '${escapeHtml(question)}', \`${escapeHtml(sql)}\`)" data-rating="${i}">⭐</span>`;
            }
            
            html += '</div>';
            // 低分输入框（初始隐藏）
            html += '<div class="feedback-reason" id="' + feedbackId + '_reason" style="display:none;margin-top:10px;">';
            html += '<textarea id="' + feedbackId + '_reason_text" placeholder="请说明SQL错误原因，帮助AI改进..." '; 
            html += 'style="width:100%;padding:8px;border:1px solid #ddd;border-radius:4px;font-size:13px;resize:vertical;min-height:60px;"></textarea>';
            html += '<button onclick="submitFeedbackWithReason(\'' + feedbackId + '\')" '; 
            html += 'style="margin-top:8px;padding:6px 16px;background:#667eea;color:white;border:none;border-radius:4px;cursor:pointer;font-size:13px;">提交反馈</button>';
            html += '</div>';
            html += '<div class="feedback-text" id="' + feedbackId + '_text" style="display:none;margin-top:8px;font-size:12px;color:#4caf50;"></div>';
            html += '</div>';
            
            return html;
        }
        
        // ✅ 新增：处理星星点击事件
        function handleStarClick(containerId, rating, question, sql) {
            // 存储当前评分和问题/SQL到容器元素上
            const container = document.getElementById(containerId);
            if (!container) return;
            
            container.dataset.rating = rating;
            container.dataset.question = question;
            container.dataset.sql = sql;
            
            // 如果评分 <= 2，显示低分输入框
            if (rating <= 2) {
                const reasonDiv = document.getElementById(containerId + '_reason');
                if (reasonDiv) {
                    reasonDiv.style.display = 'block';
                }
                
                // 高亮选中的星星
                highlightStars(containerId, rating);
            } else {
                // 高分直接提交
                submitFeedback(containerId, rating, question, sql);
            }
        }
        
        // ✅ 新增：提交带原因的反馈
        async function submitFeedbackWithReason(containerId) {
            const container = document.getElementById(containerId);
            if (!container) return;
            
            const rating = parseInt(container.dataset.rating);
            const question = container.dataset.question;
            const sql = container.dataset.sql;
            const reasonText = document.getElementById(containerId + '_reason_text').value.trim();
            
            if (!reasonText) {
                alert('请说明SQL错误原因，帮助AI改进');
                return;
            }
            
            try {
                const token = localStorage.getItem('token');
                const response = await authenticatedFetch('/api/feedback/submit', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        question: question,
                        generatedSql: sql,
                        rating: rating,
                        feedbackText: reasonText,
                        sessionId: sessionId
                    })
                });
                
                const result = await response.json();
                
                if (result.code === 200) {
                    // 隐藏输入框，显示感谢信息
                    const reasonDiv = document.getElementById(containerId + '_reason');
                    const textDiv = document.getElementById(containerId + '_text');
                    
                    if (reasonDiv) reasonDiv.style.display = 'none';
                    if (textDiv) {
                        textDiv.style.display = 'block';
                        textDiv.textContent = `✅ 感谢您的详细反馈！我们将根据您的问题改进AI模型。`;
                    }
                    
                    // 禁用所有星星
                    disableStars(containerId);
                    
                    console.log('[SQL反馈] 低分反馈提交成功:', result.data);
                } else {
                    console.error('[SQL反馈] 提交失败:', result.message);
                    alert('提交失败: ' + result.message);
                }
            } catch (error) {
                console.error('[SQL反馈] 网络错误:', error);
                alert('网络错误，请稍后重试');
            }
        }
        
        // ✅ 新增：提交SQL反馈
        async function submitFeedback(containerId, rating, question, sql) {
            try {
                console.log('[SQL反馈] 开始提交:', { containerId, rating, question });
                
                const token = localStorage.getItem('token');
                if (!token) {
                    console.error('[SQL反馈] 未登录，无token');
                    alert('请先登录');
                    return;
                }
                
                const requestBody = {
                    question: question,
                    generatedSql: sql,
                    rating: rating,
                    sessionId: sessionId
                };
                console.log('[SQL反馈] 请求体:', requestBody);
                
                const response = await authenticatedFetch('/api/feedback/submit', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(requestBody)
                });
                
                console.log('[SQL反馈] 响应状态:', response.status);
                
                // 先检查响应状态
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('[SQL反馈] HTTP错误:', response.status, errorText);
                    alert(`提交失败: HTTP ${response.status}`);
                    return;
                }
                
                // 解析JSON
                const result = await response.json();
                console.log('[SQL反馈] 响应数据:', result);
                
                if (result.code === 200) {
                    // 显示感谢信息
                    const textDiv = document.getElementById(containerId + '_text');
                    
                    if (textDiv) {
                        textDiv.style.display = 'block';
                        textDiv.textContent = `✅ 感谢您的评分（${rating}星）！`;
                    }
                    
                    // 高亮选中的星星并禁用
                    highlightStars(containerId, rating);
                    disableStars(containerId);
                    
                    console.log('[SQL反馈] 提交成功:', result.data);
                } else {
                    console.error('[SQL反馈] 业务错误:', result.message);
                    alert('提交失败: ' + result.message);
                }
            } catch (error) {
                console.error('[SQL反馈] 异常详情:', error);
                console.error('[SQL反馈] 错误堆栈:', error.stack);
                alert('网络错误，请稍后重试: ' + error.message);
            }
        }
        
        // ✅ 辅助函数：高亮星星
        function highlightStars(containerId, rating) {
            const starsDiv = document.getElementById(containerId);
            if (!starsDiv) return;
            
            const stars = starsDiv.querySelectorAll('.star-btn');
            stars.forEach((star, index) => {
                star.style.opacity = (index < rating) ? '1' : '0.3';
            });
        }
        
        // ✅ 辅助函数：禁用所有星星
        function disableStars(containerId) {
            const starsDiv = document.getElementById(containerId);
            if (!starsDiv) return;
            
            const stars = starsDiv.querySelectorAll('.star-btn');
            stars.forEach(star => {
                star.style.cursor = 'default';
                star.onclick = null;
            });
        }
        
        // ✅ 暴露函数到全局作用域（供 onclick 调用）
        window.sendMessage = sendMessage;
        window.handleSuggestionClick = handleSuggestionClick;
        window.generateChartWithType = generateChartWithType;
        window.selectDatasource = selectDatasource;
        window.confirmDatasource = confirmDatasource;
        window.showAllDatasources = showAllDatasources;
        window.submitRelationshipAnswer = submitRelationshipAnswer;
        window.submitFeedback = submitFeedback;
        window.submitFeedbackWithReason = submitFeedbackWithReason;
        window.handleStarClick = handleStarClick;
        
        // ✅ 新增：渲染动态追问提示（DeepSeek风格）
        window.renderDynamicFollowUpHints = renderDynamicFollowUpHints;
        window.triggerAISummary = triggerAISummary;
        window.triggerChartGeneration = triggerChartGeneration;
        window.triggerExcelDownload = triggerExcelDownload;
    </script>
</body>
</html>
