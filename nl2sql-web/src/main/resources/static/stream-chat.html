<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>流式对话 - NL2SQL</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            width: 90%;
            max-width: 1200px;
            height: 90vh;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }
        
        .header-actions {
            display: flex;
            gap: 10px;
        }
        
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: white;
            color: #667eea;
        }
        
        .btn-primary:hover {
            background: #f0f0f0;
        }
        
        .btn-danger {
            background: #ff4757;
            color: white;
        }
        
        .btn-danger:hover {
            background: #ff3344;
        }
        
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            background: #f8f9fa;
        }
        
        .message {
            margin-bottom: 20px;
            display: flex;
            animation: fadeIn 0.3s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message.user {
            justify-content: flex-end;
        }
        
        .message-bubble {
            max-width: 70%;
            padding: 12px 18px;
            border-radius: 12px;
            line-height: 1.6;
            word-wrap: break-word;
        }
        
        .message.user .message-bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }
        
        .message.agent .message-bubble {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 4px;
        }
        
        .message.system .message-bubble {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffc107;
            font-size: 13px;
        }
        
        .sql-display {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            overflow-x: auto;
            white-space: pre-wrap;
        }
        
        .data-table {
            margin-top: 15px;
            overflow-x: auto;
        }
        
        .data-table table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }
        
        .data-table th,
        .data-table td {
            padding: 10px 12px;
            text-align: left;
            border: 1px solid #e0e0e0;
        }
        
        .data-table th {
            background: #f5f5f5;
            font-weight: 600;
        }
        
        .data-table tr:hover {
            background: #f9f9f9;
        }
        
        .typing-indicator {
            display: inline-flex;
            gap: 4px;
            padding: 12px 18px;
            background: white;
            border-radius: 12px;
            border: 1px solid #e0e0e0;
        }
        
        .typing-dot {
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }
        
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }
        
        .input-area {
            padding: 20px 30px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }
        
        .input-wrapper {
            flex: 1;
            position: relative;
        }
        
        #messageInput {
            width: 100%;
            padding: 12px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        
        #messageInput:focus {
            border-color: #667eea;
        }
        
        #sendBtn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: transform 0.2s;
        }
        
        #sendBtn:hover {
            transform: translateY(-2px);
        }
        
        #sendBtn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .status-bar {
            padding: 8px 30px;
            background: #f8f9fa;
            border-top: 1px solid #e0e0e0;
            font-size: 12px;
            color: #666;
            display: flex;
            justify-content: space-between;
        }
        
        .event-log {
            font-size: 11px;
            color: #999;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💬 流式对话</h1>
            <div class="header-actions">
                <button class="btn btn-primary" onclick="loadHistory()">📜 历史记录</button>
                <button class="btn btn-danger" onclick="clearHistory()">🗑️ 清空</button>
            </div>
        </div>
        
        <div class="chat-area" id="chatArea">
            <div class="message agent">
                <div class="message-bubble">
                    👋 欢迎使用流式对话！我会实时显示SQL生成过程。
                </div>
            </div>
        </div>
        
        <div class="status-bar">
            <span id="connectionStatus">⚪ 未连接</span>
            <span class="event-log" id="eventLog"></span>
        </div>
        
        <div class="input-area">
            <div class="input-wrapper">
                <input type="text" id="messageInput" placeholder="输入您的问题..." onkeypress="handleKeyPress(event)">
            </div>
            <button id="sendBtn" onclick="sendMessage()">发送</button>
        </div>
    </div>
    
    <script>
        let sessionId = 'session_' + Date.now();
        let currentEventSource = null;
        
        // 发送消息
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            // 显示用户消息
            addMessage(message, 'user');
            input.value = '';
            
            // 禁用发送按钮
            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;
            
            // 显示加载状态
            showTypingIndicator();
            updateStatus('🟡 连接中...', '正在建立SSE连接...');
            
            try {
                // 创建SSE连接
                const response = await fetch('/api/chat/stream', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        sessionId: sessionId,
                        question: message,
                        datasourceId: 1 // TODO: 从选择器获取
                    })
                });
                
                if (!response.ok) {
                    throw new Error('HTTP error! status: ' + response.status);
                }
                
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                
                updateStatus('🟢 已连接', '接收流式数据...');
                
                while (true) {
                    const { done, value } = await reader.read();
                    
                    if (done) {
                        updateStatus('⚪ 已完成', '连接关闭');
                        removeTypingIndicator();
                        sendBtn.disabled = false;
                        break;
                    }
                    
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';
                    
                    for (const line of lines) {
                        if (line.startsWith('event:')) {
                            const eventName = line.substring(6).trim();
                            logEvent(eventName);
                        } else if (line.startsWith('data:')) {
                            const dataStr = line.substring(5).trim();
                            try {
                                const data = JSON.parse(dataStr);
                                handleStreamEvent(data);
                            } catch (e) {
                                console.error('解析数据失败:', e);
                            }
                        }
                    }
                }
                
            } catch (error) {
                console.error('流式对话失败:', error);
                removeTypingIndicator();
                addMessage('❌ 错误: ' + error.message, 'system');
                updateStatus('🔴 错误', error.message);
                sendBtn.disabled = false;
            }
        }
        
        // 处理流式事件
        function handleStreamEvent(data) {
            console.log('收到事件:', data);
            
            switch(data.type || 'unknown') {
                case 'start':
                    addMessage('🔄 ' + data.message, 'system');
                    break;
                    
                case 'sql_generated':
                    addMessage(`<div class="sql-display">${escapeHtml(data.sql)}</div>`, 'agent');
                    break;
                    
                case 'executing':
                    addMessage('⚙️ ' + data.message, 'system');
                    break;
                    
                case 'result':
                    if (data.data && data.data.length > 0) {
                        addMessage(renderTable(data.data), 'agent');
                    }
                    addMessage('✅ ' + (data.summary || '查询完成'), 'agent');
                    break;
                    
                case 'complete':
                    addMessage('✨ ' + data.message, 'system');
                    break;
                    
                case 'error':
                    addMessage('❌ 错误: ' + data.error, 'system');
                    break;
            }
        }
        
        // 添加消息
        function addMessage(content, type) {
            const chatArea = document.getElementById('chatArea');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            messageDiv.innerHTML = `<div class="message-bubble">${content}</div>`;
            chatArea.appendChild(messageDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }
        
        // 显示加载指示器
        function showTypingIndicator() {
            const chatArea = document.getElementById('chatArea');
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message agent';
            typingDiv.id = 'typingIndicator';
            typingDiv.innerHTML = `
                <div class="typing-indicator">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            `;
            chatArea.appendChild(typingDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }
        
        // 移除加载指示器
        function removeTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) {
                indicator.remove();
            }
        }
        
        // 渲染表格
        function renderTable(data) {
            if (!data || data.length === 0) return '<p>无数据</p>';
            
            const headers = Object.keys(data[0]);
            let html = '<div class="data-table"><table><thead><tr>';
            headers.forEach(h => {
                html += `<th>${escapeHtml(h)}</th>`;
            });
            html += '</tr></thead><tbody>';
            
            data.forEach(row => {
                html += '<tr>';
                headers.forEach(h => {
                    html += `<td>${escapeHtml(String(row[h] ?? ''))}</td>`;
                });
                html += '</tr>';
            });
            
            html += '</tbody></table></div>';
            return html;
        }
        
        // HTML转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // 更新状态栏
        function updateStatus(status, event) {
            document.getElementById('connectionStatus').textContent = status;
            document.getElementById('eventLog').textContent = event;
        }
        
        // 记录事件
        function logEvent(eventName) {
            const eventLog = document.getElementById('eventLog');
            eventLog.textContent = `事件: ${eventName}`;
        }
        
        // 处理回车键
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
        
        // 加载历史记录
        async function loadHistory() {
            try {
                const response = await fetch(`/api/chat/history/${sessionId}?limit=10`);
                const result = await response.json();
                
                if (result.code === 200 && result.data) {
                    addMessage(`📜 加载了 ${result.data.length} 条历史记录`, 'system');
                }
            } catch (error) {
                console.error('加载历史失败:', error);
            }
        }
        
        // 清空历史
        async function clearHistory() {
            if (!confirm('确定要清空对话历史吗？')) return;
            
            try {
                const response = await fetch(`/api/chat/history/${sessionId}`, {
                    method: 'DELETE'
                });
                const result = await response.json();
                
                if (result.code === 200) {
                    document.getElementById('chatArea').innerHTML = `
                        <div class="message agent">
                            <div class="message-bubble">
                                🗑️ 对话历史已清空
                            </div>
                        </div>
                    `;
                    sessionId = 'session_' + Date.now();
                }
            } catch (error) {
                console.error('清空历史失败:', error);
            }
        }
    </script>
</body>
</html>
