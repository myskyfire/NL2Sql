server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-request: true
      force-response: true
  tomcat:
    uri-encoding: UTF-8

# 本地元数据存储库配置（唯一数据源）
spring:
  profiles:
    active: local  # ✅ 激活本地配置（application-local.yml）
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-request: true
      force-response: true
  datasource:
    url: jdbc:mysql://localhost:3306/nl2sql_meta_db?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 60000
      maximum-pool-size: 10
      minimum-idle: 5
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  web:
    resources:
      cache:
        period: 0  # ✅ 开发环境：不缓存静态资源
      chain:
        strategy:
          content:
            enabled: true  # ✅ 启用内容版本策略

# LLM Configuration - 多提供者架构
# 支持企业内部部署的多种LLM后端（Ollama、ChatGLM、Qwen、Baichuan等）
llm:
  # 活跃的提供者名称（根据环境切换）
  # 开发: ollama
  # 生产: vllm | tgi | tensorrt | llamacpp | aliyun
  active-provider: aliyun
  
  # 提供者优先级列表（用于自动故障转移）
  provider-priority:
    - aliyun
    - ollama
    - vllm
    - tgi
    - tensorrt
    - llamacpp
    - chatglm
    - qwen
  
  # ========== 阿里云通义千问配置（生产 - API调用）==========
  aliyun:
    enabled: true
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model: qwen-plus
    api-key: ${ALIYUN_API_KEY}
    timeout: 60
  
  # ========== Ollama配置（开发环境）==========
  ollama:
    enabled: false
    base-url: http://localhost:11434
    code-model: qwen2.5-coder:7b-instruct-q4_0
    nlp-model: qwen3:8b
    timeout: 60
  
  # ========== vLLM配置（生产 - 高性能GPU）==========
  vllm:
    enabled: false
    base-url: http://localhost:8000/v1
    model: Qwen/Qwen3-8B
    api-key: ${VLLM_API_KEY:}
    timeout: 60
  
  # ========== TGI配置（生产 - HuggingFace官方）==========
  tgi:
    enabled: false
    base-url: http://localhost:8080/v1
    model: Qwen/Qwen3-8B
    api-key: ""
    timeout: 60
  
  # ========== TensorRT-LLM配置（生产 - NVIDIA优化）==========
  tensorrt:
    enabled: false
    base-url: http://localhost:8000/v1
    model: qwen3-8b-trt
    api-key: ${TRITON_API_KEY:}
    timeout: 60
  
  # ========== llama.cpp配置（生产 - CPU/GPU混合）==========
  llamacpp:
    enabled: false
    base-url: http://localhost:8080/v1
    model: /models/qwen3-8b-q4_k_m.gguf
    api-key: ""
    timeout: 60
  
  # ChatGLM配置（企业内部部署，预留）
  chatglm:
    enabled: false
    base-url: http://chatglm.internal.company.com:8000
    model: chatglm3-6b
    api-key: ${CHATGLM_API_KEY:}
    timeout: 60
  
  # Qwen配置（企业内部部署，预留）
  qwen:
    enabled: false
    base-url: http://qwen.internal.company.com:8000
    model: qwen-7b-chat
    api-key: ${QWEN_API_KEY:}
    timeout: 60
  
  # Baichuan配置（企业内部部署，预留）
  baichuan:
    enabled: false
    base-url: http://baichuan.internal.company.com:8000
    model: baichuan2-13b-chat
    api-key: ${BAICHUAN_API_KEY:}
    timeout: 60

# Chroma Vector Database Configuration (RAG)
chroma:
  enabled: true  # ✅ 使用 LangChain4j 原生 V2 API 支持
  url: http://[::1]:8000  # ⚠️ Chroma 绑定在 IPv6 localhost
  collection-name: NL2SQL_rag

# Ollama Embedding Configuration - 支持多种嵌入模型
ollama:
  base-url: http://localhost:11434
  embedding-model: bge-m3  # 可切换: bge-m3 | text-embedding-ada-002 | m3e-base | nomic-embed-text
  timeout: 120  # ✅ 增加到120秒，避免首次加载模型超时

# Reranker Configuration - Jina AI重排序服务
reranker:
  provider: jina  # jina | flag-embedding(本地)
  top-k: 5        # 返回Top-K结果
  threshold: 0.5  # 最低相关性阈值
  jina:
    api-key: jina_8dbdaf5c1b7d40dca36fae57943eec15EjCz5qiHqCfdJl2x7q9vfLZm84hJ
    model: jina-reranker-v2-base-multilingual

# MyBatis Plus Configuration
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  # ✅ Mapper XML文件位置
  mapper-locations: classpath*:mapper/**/*.xml

# Logging
logging:
  file:
    name: ${user.dir}/logs/NL2SQL.log
    path: ${user.dir}/logs
  level:
    com.nl2sql: DEBUG
    dev.langchain4j: DEBUG
    org.springframework.jdbc.core: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50}:%line - %msg%n'
    file: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50}:%line - %msg%n'

# SQL执行配置
sql:
  execution:
    query-timeout: 30
    slow-query-threshold: 5
    max-rows: 100
    table-stats-cache-hours: 12

# 表选择配置
table-selection:
  # 自动选择数据源：当LLM唯一确定且confidence=high时，跳过前端确认
  auto-select-datasource: true

# Skills 配置
skills:
  groovy:
    # 自动扫描的 Skills 目录列表（相对于 classpath:skills/）
    scan-dirs:
      - standard-query
      - report-with-insights
      - sql-validate-execute      # SQL验证与执行
      - sql-performance-analysis  # SQL性能分析
      - hybrid-example            # ✅ 混合模式示例（Workflow + Groovy）

# 管理端点配置
admin:
  api:
    key: ${ADMIN_API_KEY:}  # 生产环境请设置环境变量 ADMIN_API_KEY

# Spring Boot Actuator 配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
