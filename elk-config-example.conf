# ============================================
# ELK日志分析配置示例
# ============================================

# 1. Logstash配置文件 (logstash.conf)
# ============================================

input {
  # 从文件读取JSON日志
  file {
    path => "/tmp/logs/nlp2sql*.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => "json"
    type => "nlp2sql-log"
  }
  
  # SQL审计日志
  file {
    path => "/tmp/logs/nlp2sql-sql-audit*.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => "json"
    type => "sql-audit"
  }
}

filter {
  # 处理时间戳
  date {
    match => ["timestamp", "yyyy-MM-dd'T'HH:mm:ss.SSSXXX"]
    target => "@timestamp"
    timezone => "Asia/Shanghai"
  }
  
  # 添加环境标签
  if [env] == "prod" {
    mutate {
      add_tag => ["production"]
    }
  } else if [env] == "dev" {
    mutate {
      add_tag => ["development"]
    }
  }
  
  # 解析SQL审计日志
  if [type] == "sql-audit" {
    mutate {
      add_field => {
        "log_category" => "sql_audit"
      }
    }
  }
  
  # 错误日志特殊标记
  if [level] == "ERROR" {
    mutate {
      add_tag => ["error"]
    }
  }
  
  # 慢查询标记
  if [executionTime] and [executionTime] > 5000 {
    mutate {
      add_tag => ["slow_query"]
    }
  }
}

output {
  # 输出到Elasticsearch
  elasticsearch {
    hosts => ["http://localhost:9200"]
    index => "nlp2sql-logs-%{+YYYY.MM.dd}"
    user => "elastic"
    password => "your_password"
  }
  
  # 调试输出（可选）
  # stdout { codec => rubydebug }
}


# 2. Elasticsearch索引模板 (index-template.json)
# ============================================
{
  "index_patterns": ["nlp2sql-logs-*"],
  "settings": {
    "number_of_shards": 1,
    "number_of_replicas": 0,
    "refresh_interval": "5s"
  },
  "mappings": {
    "properties": {
      "@timestamp": {
        "type": "date"
      },
      "timestamp": {
        "type": "date"
      },
      "app": {
        "type": "keyword"
      },
      "env": {
        "type": "keyword"
      },
      "level": {
        "type": "keyword"
      },
      "logger_name": {
        "type": "keyword"
      },
      "message": {
        "type": "text",
        "analyzer": "ik_max_word"
      },
      "userId": {
        "type": "long"
      },
      "username": {
        "type": "keyword"
      },
      "requestId": {
        "type": "keyword"
      },
      "sessionId": {
        "type": "keyword"
      },
      "sqlText": {
        "type": "text",
        "analyzer": "ik_max_word"
      },
      "executionTime": {
        "type": "long"
      },
      "thread_name": {
        "type": "keyword"
      },
      "tags": {
        "type": "keyword"
      }
    }
  }
}


# 3. Kibana常用查询示例
# ============================================

# 查询某个用户的所有操作
GET nlp2sql-logs-*/_search
{
  "query": {
    "term": {
      "userId": 1
    }
  },
  "sort": [
    {
      "@timestamp": {
        "order": "desc"
      }
    }
  ]
}

# 查询慢查询（执行时间>5秒）
GET nlp2sql-logs-*/_search
{
  "query": {
    "range": {
      "executionTime": {
        "gte": 5000
      }
    }
  }
}

# 查询某个请求的完整链路
GET nlp2sql-logs-*/_search
{
  "query": {
    "term": {
      "requestId": "abc123def456"
    }
  }
}

# 统计各用户的查询次数
GET nlp2sql-logs-*/_search
{
  "size": 0,
  "aggs": {
    "queries_by_user": {
      "terms": {
        "field": "username",
        "size": 10
      }
    }
  }
}

# 查询错误日志
GET nlp2sql-logs-*/_search
{
  "query": {
    "bool": {
      "must": [
        {
          "term": {
            "level": "ERROR"
          }
        }
      ],
      "filter": [
        {
          "range": {
            "@timestamp": {
              "gte": "now-24h"
            }
          }
        }
      ]
    }
  }
}

# SQL审计日志分析
GET nlp2sql-logs-*/_search
{
  "query": {
    "term": {
      "type": "sql_audit"
    }
  },
  "aggs": {
    "avg_execution_time": {
      "avg": {
        "field": "executionTime"
      }
    }
  }
}


# 4. 部署步骤
# ============================================

# 4.1 安装Elasticsearch
# docker run -d --name elasticsearch \
#   -p 9200:9200 -p 9300:9300 \
#   -e "discovery.type=single-node" \
#   -e "xpack.security.enabled=true" \
#   elasticsearch:8.11.0

# 4.2 安装Kibana
# docker run -d --name kibana \
#   -p 5601:5601 \
#   --link elasticsearch \
#   kibana:8.11.0

# 4.3 安装Logstash
# docker run -d --name logstash \
#   -v $(pwd)/logstash.conf:/usr/share/logstash/pipeline/logstash.conf \
#   logstash:8.11.0

# 4.4 应用启动时指定日志路径
# java -jar nlp2sql-web.jar \
#   -DLOG_PATH=/var/log/nlp2sql \
#   -Dspring.profiles.active=prod


