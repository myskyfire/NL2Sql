<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NL2SQL查询</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', Arial, sans-serif; background: #f5f7fa; padding: 20px; }
        .query-container { max-width: 1200px; margin: 0 auto; }
        .input-section { background: white; border-radius: 8px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .input-section h3 { margin-bottom: 16px; color: #333; }
        textarea { width: 100%; min-height: 100px; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; resize: vertical; }
        textarea:focus { outline: none; border-color: #667eea; }
        .btn { margin-top: 12px; padding: 10px 24px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(102,126,234,0.3); }
        .btn-export { margin-left: 10px; background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); }
        .btn-secondary { margin-left: 10px; background: linear-gradient(135deg, #6c757d 0%, #495057 100%); }
        .result-section { background: white; border-radius: 8px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .sql-display { background: #f5f7fa; padding: 12px; border-radius: 6px; font-family: monospace; font-size: 13px; margin: 12px 0; overflow-x: auto; position: relative; }
        .sql-actions { margin-top: 10px; display: flex; gap: 10px; align-items: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #f0f0f0; font-size: 13px; }
        th { background: #f5f7fa; font-weight: 600; }
        .message { padding: 12px; border-radius: 6px; margin-bottom: 12px; }
        .message.error { background: #ffebee; color: #c62828; }
        .message.success { background: #e8f5e9; color: #2e7d32; }
        .message.warning { background: #fff3e0; color: #ef6c00; }
        .chart-section { margin-top: 20px; padding: 16px; background: #f9f9f9; border-radius: 6px; }
        .chart-tabs { display: flex; gap: 10px; margin-bottom: 12px; }
        .chart-tab { padding: 8px 16px; background: white; border: 1px solid #ddd; border-radius: 4px; cursor: pointer; }
        .chart-tab.active { background: #667eea; color: white; border-color: #667eea; }
        .chart-container { min-height: 300px; background: white; padding: 16px; border-radius: 6px; }
        .options-row { display: flex; gap: 20px; margin-top: 12px; flex-wrap: wrap; }
        .option-item { display: flex; align-items: center; gap: 8px; }
        .option-item label { font-size: 14px; color: #555; cursor: pointer; }
        .option-item input[type="checkbox"] { cursor: pointer; }
        select { padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="query-container">
        <div class="input-section">
            <h3>输入你的问题</h3>
            
            <!-- 数据源选择 -->
            <div style="margin-bottom: 15px;">
                <label style="display:block;margin-bottom:5px;color:#555;font-weight:500;">📊 选择数据源：</label>
                <select id="datasourceSelect" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:5px;font-size:14px;">
                    <option value="">-- 请选择数据源 --</option>
                </select>
            </div>
            
            <textarea id="queryInput" placeholder="例如：查看上个月订单数量"></textarea>
            
            <div class="options-row">
                <div class="option-item">
                    <input type="checkbox" id="autoExecute" checked>
                    <label for="autoExecute">自动生成后立即执行</label>
                </div>
                <div class="option-item">
                    <label for="resultMode">结果显示：</label>
                    <select id="resultMode">
                        <option value="data">仅显示数据</option>
                        <option value="summary" selected>AI智能总结</option>
                    </select>
                </div>
            </div>
            
            <button class="btn" onclick="executeQuery()">🚀 执行查询</button>
            <button class="btn btn-export" id="exportBtn" onclick="exportToExcel()" style="display:none;">📊 导出Excel</button>
        </div>
        <div class="result-section" id="resultSection" style="display:none;">
            <h3>查询结果</h3>
            <div id="messages"></div>
            <div id="sqlDisplay"></div>
            <div id="chartSection" class="chart-section" style="display:none;">
                <h4 style="margin-bottom: 12px;">📊 图表推荐</h4>
                <div id="chartTabs" class="chart-tabs"></div>
                <div id="chartContainer" class="chart-container"></div>
            </div>
            <div id="tableContainer"></div>
            <div id="aiSummary" style="display:none;"></div>
        </div>
    </div>
    <script>
        const token = localStorage.getItem('token');
        const userInfo = JSON.parse(localStorage.getItem('userInfo') || '{}');
        let currentSQL = null;
        let currentData = null;
        let currentQuery = null;  // 保存原始用户查询
        
        // 页面加载时获取数据源列表
        window.onload = async function() {
            await loadDatasources();
        };
        
        // 加载数据源列表
        async function loadDatasources() {
            try {
                const response = await fetch('/api/admin/datasource/list', {
                    headers: { 'Authorization': token }
                });
                const result = await response.json();
                
                if (result.code === 200 && result.data) {
                    const select = document.getElementById('datasourceSelect');
                    
                    if (result.data.length === 0) {
                        select.innerHTML = '<option value="">暂无可用数据源，请联系管理员配置</option>';
                        return;
                    }
                    
                    select.innerHTML = '<option value="">-- 请选择数据源 --</option>' + 
                        result.data.map(ds => `<option value="${ds.id}">${escapeHtml(ds.name)} (${escapeHtml(ds.host)})</option>`).join('');
                }
            } catch (error) {
                console.error('加载数据源失败:', error);
            }
        }
        
        async function executeQuery() {
            const query = document.getElementById('queryInput').value.trim();
            if (!query) { alert('请输入查询内容'); return; }
            
            const datasourceId = document.getElementById('datasourceSelect').value;
            if (!datasourceId) {
                alert('⚠️ 请先选择数据源');
                return;
            }
            
            const autoExecute = document.getElementById('autoExecute').checked;
            const resultMode = document.getElementById('resultMode').value;
            
            const resultSection = document.getElementById('resultSection');
            const messagesDiv = document.getElementById('messages');
            const sqlDisplay = document.getElementById('sqlDisplay');
            const tableContainer = document.getElementById('tableContainer');
            const aiSummaryDiv = document.getElementById('aiSummary');
            const exportBtn = document.getElementById('exportBtn');
            const chartSection = document.getElementById('chartSection');
            
            resultSection.style.display = 'block';
            messagesDiv.innerHTML = '<div class="message success">正在生成SQL...</div>';
            sqlDisplay.innerHTML = '';
            tableContainer.innerHTML = '';
            aiSummaryDiv.style.display = 'none';
            aiSummaryDiv.innerHTML = '';
            chartSection.style.display = 'none';
            exportBtn.style.display = 'none';
            currentSQL = null;
            currentData = null;
            currentQuery = query;  // 保存原始查询
            
            try {
                // 第一步：生成SQL
                const response = await fetch('/api/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': token },
                    body: JSON.stringify({ 
                        query: query, 
                        username: userInfo.username, 
                        sessionId: 'default',
                        datasourceId: parseInt(datasourceId),
                        autoExecute: false  // 先不自动执行
                    })
                });
                const result = await response.json();
                
                if (result.code === 200 && result.data) {
                    const data = result.data;
                    let messagesHtml = '';
                    
                    // 处理需要澄清的情况
                    if (data.status === 'clarification') {
                        messagesHtml += `<div class="message warning">💬 ${data.clarification || '请补充更多信息'}</div>`;
                        messagesDiv.innerHTML = messagesHtml;
                        sqlDisplay.innerHTML = '';
                        tableContainer.innerHTML = '';
                        return;
                    }
                    
                    // 处理错误情况（如缺少元数据）
                    if (data.status === 'error') {
                        messagesHtml += `<div class="message error">❌ ${data.error || '查询失败'}</div>`;
                        messagesDiv.innerHTML = messagesHtml;
                        sqlDisplay.innerHTML = '';
                        tableContainer.innerHTML = '';
                        return;
                    }
                    
                    // 处理权限禁止
                    if (data.status === 'forbidden') {
                        messagesHtml += `<div class="message error">🚫 ${data.error}</div>`;
                        messagesDiv.innerHTML = messagesHtml;
                        sqlDisplay.innerHTML = '';
                        tableContainer.innerHTML = '';
                        return;
                    }
                    
                    if (data.warning) {
                        messagesHtml += `<div class="message warning">⚠️ ${data.warning}</div>`;
                    }
                    
                    if (data.generatedSQL) {
                        currentSQL = data.generatedSQL;
                        messagesHtml += `<div class="message success">✅ SQL生成成功</div>`;
                        
                        // 显示SQL和操作按钮
                        sqlDisplay.innerHTML = `
                            <strong>生成的SQL:</strong>
                            <div class="sql-display">${escapeHtml(data.generatedSQL)}</div>
                            <div class="sql-actions">
                                <button class="btn" onclick="executeManualSQL()">▶️ 手动执行</button>
                                <button class="btn btn-secondary" onclick="copySQL()">📋 复制SQL</button>
                                <button class="btn btn-secondary" onclick="editSQL()">✏️ 编辑SQL</button>
                            </div>
                        `;
                        
                        messagesDiv.innerHTML = messagesHtml;
                        
                        // 如果勾选了自动执行，立即执行
                        if (autoExecute) {
                            await executeManualSQL();
                        }
                    } else {
                        messagesDiv.innerHTML = messagesHtml + '<div class="message error">SQL生成失败</div>';
                    }
                }
            } catch (error) {
                messagesDiv.innerHTML = `<div class="message error">请求失败: ${error.message}</div>`;
            }
        }
        
        // 手动执行SQL
        async function executeManualSQL() {
            if (!currentSQL) {
                alert('没有可执行的SQL');
                return;
            }
            
            const datasourceId = document.getElementById('datasourceSelect').value;
            if (!datasourceId) {
                alert('⚠️ 请先选择数据源');
                return;
            }
            
            const resultMode = document.getElementById('resultMode').value;
            const tableContainer = document.getElementById('tableContainer');
            const aiSummaryDiv = document.getElementById('aiSummary');
            const exportBtn = document.getElementById('exportBtn');
            const messagesDiv = document.getElementById('messages');
            
            messagesDiv.innerHTML += '<div class="message success">正在执行SQL...</div>';
            tableContainer.innerHTML = '<div style="text-align:center;padding:20px;color:#999;">⏳ 执行中...</div>';
            aiSummaryDiv.style.display = 'none';
            
            try {
                const response = await fetch('/api/manual-sql', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': token },
                    body: JSON.stringify({ 
                        sql: currentSQL,
                        datasourceId: parseInt(datasourceId)
                    })
                });
                
                const result = await response.json();
                
                if (result.code === 200) {
                    if (result.data.error) {
                        tableContainer.innerHTML = `<div class="message error">❌ 执行失败: ${result.data.error}</div>`;
                        exportBtn.style.display = 'none';
                        return;
                    }
                    
                    currentData = result.data.data;
                    
                    // 显示数据表格
                    if (currentData && currentData.length > 0) {
                        const headers = Object.keys(currentData[0]);
                        let tableHtml = '<table><thead><tr>' + headers.map(h => `<th>${escapeHtml(h)}</th>`).join('') + '</tr></thead><tbody>';
                        currentData.forEach(row => {
                            tableHtml += '<tr>' + headers.map(h => `<td>${row[h] !== null ? escapeHtml(String(row[h])) : ''}</td>`).join('') + '</tr>';
                        });
                        tableHtml += '</tbody></table>';
                        tableContainer.innerHTML = `
                            <p style="margin-top:12px;color:#666;">✅ 返回 ${result.data.rowCount} 行数据，耗时 ${result.data.executionTime.toFixed(3)} 秒</p>
                            ${tableHtml}
                        `;
                        
                        // 仅在“仅显示数据”模式下显示导出按钮
                        if (resultMode === 'data') {
                            exportBtn.style.display = 'inline-block';
                        } else {
                            exportBtn.style.display = 'none';
                        }
                        
                        // 如果需要AI总结
                        if (resultMode === 'summary') {
                            await generateSummary(currentSQL, currentData);
                        }
                    } else {
                        tableContainer.innerHTML = '<div class="message warning">⚠️ 查询结果为空</div>';
                        exportBtn.style.display = 'none';
                    }
                } else {
                    tableContainer.innerHTML = `<div class="message error">❌ ${result.message}</div>`;
                    exportBtn.style.display = 'none';
                }
            } catch (error) {
                tableContainer.innerHTML = `<div class="message error">❌ 执行失败: ${error.message}</div>`;
                exportBtn.style.display = 'none';
            }
        }
        
        // 生成AI总结
        async function generateSummary(sql, data) {
            const aiSummaryDiv = document.getElementById('aiSummary');
            aiSummaryDiv.style.display = 'block';
            aiSummaryDiv.innerHTML = '<div style="padding:20px;text-align:center;color:#999;">⏳ AI正在分析数据...</div>';
            
            console.log('[AI总结] currentQuery:', currentQuery);
            console.log('[AI总结] sql:', sql);
            console.log('[AI总结] data行数:', data.length);
            
            try {
                const response = await fetch('/api/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': token },
                    body: JSON.stringify({ 
                        query: currentQuery,  // 传入原始用户查询
                        username: userInfo.username,
                        sessionId: 'default',
                        skipSQLGeneration: true,  // 跳过SQL生成，直接让LLM总结
                        sql: sql,  // 传入SQL语句
                        data: data  // 传入查询结果数据
                    })
                });
                
                const result = await response.json();
                
                if (result.code === 200 && result.data.summary) {
                    aiSummaryDiv.innerHTML = `
                        <div style="margin-top:16px;padding:16px;background:linear-gradient(135deg, #667eea15 0%, #764ba215 100%);border-radius:8px;border-left:4px solid #667eea;">
                            <h4 style="margin-bottom:12px;color:#667eea;">🤖 AI智能总结</h4>
                            <div style="line-height:1.8;color:#333;">${result.data.summary}</div>
                        </div>
                    `;
                } else {
                    aiSummaryDiv.innerHTML = '<div class="message warning">⚠️ AI总结生成失败</div>';
                }
            } catch (error) {
                aiSummaryDiv.innerHTML = `<div class="message error">❌ 总结失败: ${error.message}</div>`;
            }
        }
        
        // 复制SQL
        function copySQL() {
            if (!currentSQL) return;
            navigator.clipboard.writeText(currentSQL).then(() => {
                alert('✅ SQL已复制到剪贴板');
            }).catch(() => {
                alert('❌ 复制失败');
            });
        }
        
        // 编辑SQL
        function editSQL() {
            if (!currentSQL) return;
            const newSQL = prompt('编辑SQL:', currentSQL);
            if (newSQL !== null && newSQL.trim()) {
                currentSQL = newSQL.trim();
                // 更新显示
                const sqlDisplay = document.querySelector('.sql-display');
                if (sqlDisplay) {
                    sqlDisplay.textContent = currentSQL;
                }
                alert('✅ SQL已更新，可以点击“手动执行”重新执行');
            }
        }
        
        // 监听结果显示模式变化
        document.addEventListener('DOMContentLoaded', function() {
            const resultModeSelect = document.getElementById('resultMode');
            if (resultModeSelect) {
                resultModeSelect.addEventListener('change', function() {
                    const exportBtn = document.getElementById('exportBtn');
                    // 如果已有数据，根据模式切换导出按钮可见性
                    if (currentData && currentData.length > 0) {
                        if (this.value === 'data') {
                            exportBtn.style.display = 'inline-block';
                        } else {
                            exportBtn.style.display = 'none';
                        }
                    }
                });
            }
        });
        
        // HTML转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // 渲染图表
        function renderCharts(recommendation) {
            const chartSection = document.getElementById('chartSection');
            const chartTabs = document.getElementById('chartTabs');
            const chartContainer = document.getElementById('chartContainer');
            
            chartSection.style.display = 'block';
            chartTabs.innerHTML = '';
            chartContainer.innerHTML = '';
            
            const charts = recommendation.charts;
            
            // 创建标签页
            charts.forEach((chart, index) => {
                const tab = document.createElement('div');
                tab.className = 'chart-tab' + (index === 0 ? ' active' : '');
                tab.textContent = chart.type === 'TABLE' ? '📋 表格' : 
                                 chart.type === 'BAR' ? '📊 柱状图' :
                                 chart.type === 'LINE' ? '📈 折线图' :
                                 chart.type === 'PIE' ? '🥧 饼图' : chart.type;
                tab.onclick = () => showChart(index);
                chartTabs.appendChild(tab);
            });
            
            // 显示第一个图表
            showChart(0);
            
            function showChart(index) {
                // 更新标签激活状态
                document.querySelectorAll('.chart-tab').forEach((tab, i) => {
                    tab.classList.toggle('active', i === index);
                });
                
                const chart = charts[index];
                
                if (chart.type === 'TABLE') {
                    // 表格视图
                    let html = '<table><thead><tr>';
                    if (chart.series && chart.series.length > 0) {
                        const headers = Object.keys(chart.series[0]);
                        headers.forEach(h => html += `<th>${h}</th>`);
                        html += '</tr></thead><tbody>';
                        chart.series.forEach(row => {
                            html += '<tr>';
                            headers.forEach(h => html += `<td>${row[h] !== null ? row[h] : ''}</td>`);
                            html += '</tr>';
                        });
                    }
                    html += '</tbody></table>';
                    chartContainer.innerHTML = html;
                } else if (chart.type === 'BAR' || chart.type === 'LINE') {
                    // 柱状图/折线图（简化文本展示）
                    let html = `<h4>${chart.title}</h4>`;
                    html += '<div style="margin-top:12px;">';
                    if (chart.xLabels && chart.series) {
                        chart.series.forEach(serie => {
                            html += `<div style="margin-bottom:8px;"><strong>${serie.name}:</strong></div>`;
                            serie.data.forEach((val, i) => {
                                html += `<div style="padding:4px 0;">${chart.xLabels[i]}: ${val}</div>`;
                            });
                        });
                    }
                    html += '</div>';
                    html += '<div style="margin-top:12px;padding:8px;background:#f0f0f0;border-radius:4px;font-size:12px;color:#666;">💡 提示：集成ECharts后可显示可视化图表</div>';
                    chartContainer.innerHTML = html;
                } else if (chart.type === 'PIE') {
                    // 饼图（简化文本展示）
                    let html = `<h4>${chart.title}</h4>`;
                    html += '<div style="margin-top:12px;">';
                    if (chart.series && chart.series.length > 0) {
                        const items = chart.series[0].data || [];
                        items.forEach(item => {
                            html += `<div style="padding:6px 0;">🔹 ${item.name}: ${item.value}</div>`;
                        });
                    }
                    html += '</div>';
                    html += '<div style="margin-top:12px;padding:8px;background:#f0f0f0;border-radius:4px;font-size:12px;color:#666;">💡 提示：集成ECharts后可显示饼图</div>';
                    chartContainer.innerHTML = html;
                }
            }
        }
        
        async function exportToExcel() {
            if (!currentSQL) {
                alert('没有可导出的查询');
                return;
            }
            
            try {
                const response = await fetch('/api/export/excel', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': token
                    },
                    body: JSON.stringify({
                        sql: currentSQL,
                        fileName: '查询结果'
                    })
                });
                
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(errorText || '导出失败');
                }
                
                // 下载文件
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                
                // 从响应头获取文件名
                const contentDisposition = response.headers.get('Content-Disposition');
                let fileName = '查询结果.xlsx';
                if (contentDisposition) {
                    const filenameMatch = contentDisposition.match(/filename\*?=(?:UTF-8'')?([^;]+)/i);
                    if (filenameMatch && filenameMatch[1]) {
                        fileName = decodeURIComponent(filenameMatch[1].replace(/"/g, ''));
                    }
                }
                
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
                
                alert('导出成功！');
                
            } catch (error) {
                alert('导出失败: ' + error.message);
                console.error('导出错误:', error);
            }
        }
    </script>
</body>
</html>
