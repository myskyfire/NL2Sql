server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-request: true
      force-response: true
  tomcat:
    uri-encoding: UTF-8

# 本地元数据存储库配置（唯一数据源）
spring:
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-request: true
      force-response: true
  datasource:
    url: jdbc:mysql://localhost:3306/nl2sql_meta_db?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 60000
      maximum-pool-size: 10
      minimum-idle: 5
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# LLM Configuration - 多提供者架构
# 支持企业内部部署的多种LLM后端（Ollama、ChatGLM、Qwen、Baichuan等）
llm:
  # 活跃的提供者名称（ollama | chatglm | qwen | baichuan）
  active-provider: ollama
  
  # 提供者优先级列表（用于自动故障转移）
  provider-priority:
    - ollama
    - chatglm
    - qwen
  
  # Ollama配置（本地私有化部署）
  ollama:
    enabled: true
    base-url: http://localhost:11434
    code-model: qwen2.5-coder:7b-instruct-q4_0
    nlp-model: qwen3:8b
    timeout: 60
  
  # ChatGLM配置（企业内部部署，预留）
  chatglm:
    enabled: false
    base-url: http://chatglm.internal.company.com:8000
    model: chatglm3-6b
    api-key: ${CHATGLM_API_KEY:}
    timeout: 60
  
  # Qwen配置（企业内部部署，预留）
  qwen:
    enabled: false
    base-url: http://qwen.internal.company.com:8000
    model: qwen-7b-chat
    api-key: ${QWEN_API_KEY:}
    timeout: 60
  
  # Baichuan配置（企业内部部署，预留）
  baichuan:
    enabled: false
    base-url: http://baichuan.internal.company.com:8000
    model: baichuan2-13b-chat
    api-key: ${BAICHUAN_API_KEY:}
    timeout: 60

# Chroma Vector Database Configuration (RAG)
chroma:
  enabled: true  # ✅ 使用 LangChain4j 原生 V2 API 支持
  url: http://[::1]:8000  # ⚠️ Chroma 绑定在 IPv6 localhost
  collection-name: NL2SQL_rag

# MyBatis Plus Configuration
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Logging
logging:
  level:
    com.nl2sql: DEBUG
    dev.langchain4j: DEBUG
    org.springframework.jdbc.core: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n'

# SQL执行配置
sql:
  execution:
    query-timeout: 30
    slow-query-threshold: 5
    max-rows: 100
    table-stats-cache-hours: 12

# Skills 配置
skills:
  groovy:
    # 自动扫描的 Skills 目录列表（相对于 classpath:skills/）
    scan-dirs:
      - standard-query
      - report-with-insights

# Spring Boot Actuator 配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
