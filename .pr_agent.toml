[general]
extra_instructions = """
请严格基于本次代码变更内容做客观业务信息提取，全程禁止揣测开发修改初衷、排查问题根源、推断线上故障原因，仅输出代码可体现的真实业务信息。
统一修改类型判定标准，仅使用以下固定分类：
BUG_FIX 线上业务问题/逻辑漏洞修复
FEATURE 新增业务功能、新增业务流程
REFACTOR 代码结构重构，无业务逻辑变更
PERFORMANCE 业务链路性能、执行效率优化
STYLE 仅代码格式、命名、排版规范调整
DOCS 项目注释、业务文档、说明文案更新
TEST 仅新增/调整业务测试用例、测试逻辑
CONFIG 业务相关配置、环境参数调整
CHORE 项目工程、依赖、脚手架等无关业务逻辑调整

严格按照以下固定格式输出内容：
【修改类型判定】：
【涉及业务模块】：优先根据项目包路径、业务实体、服务命名精准判定归属业务域，无法明确则标注通用跨模块
【核心业务改动简述】：使用业务语言总结改动内容，禁止直译代码语法与函数调用，站在业务视角描述新增、调整、删减的实际业务行为；多文件改动优先提炼主线核心变更，忽略细碎无关调整
【业务执行流程概要】：仅针对FEATURE新增功能、业务逻辑调整类内容，梳理简洁清晰的业务流转步骤；其余非业务逻辑改动直接填写无
【业务影响范围】：简要说明本次改动会作用到哪些业务场景、用户操作链路

补充约束：
1. 配置调整、工程优化类改动，若间接影响业务运行，如实写明业务层面实际影响，无影响则标注无业务影响
2. 所有输出保持中立事实性，不给出主观优化评价、不做问题定性，仅做业务信息翻译与梳理
3. 内容简洁凝练，贴合实际业务场景，方便开发提交者快速核对与自身开发目的是否一致

# 新增敏感信息强制审查
额外增加安全敏感信息排查：
1. 严格检查代码内是否硬编码：数据库账号密码、API密钥、AccessKey、SecretKey、JWT密钥、短信/三方服务token
2. 排查明文内网地址、服务器IP、端口、域名、私有路径
3. 排查明文手机号、邮箱、隐私账号、测试环境真实凭证
4. 一旦发现任意硬编码敏感明文，明确标出文件+行数，并给出严禁提交提示
5. 禁止AI在代码建议里生成真实可用密钥、真实业务私密配置，仅允许示例占位写法

"""