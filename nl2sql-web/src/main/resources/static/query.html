<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQL生成器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', Arial, sans-serif; background: #f5f7fa; padding: 20px; }
        .query-container { max-width: 1200px; margin: 0 auto; }
        .input-section { background: white; border-radius: 8px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .input-section h3 { margin-bottom: 16px; color: #333; }
        textarea { width: 100%; min-height: 100px; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; resize: vertical; }
        textarea:focus { outline: none; border-color: #667eea; }
        .btn { margin-top: 12px; padding: 10px 24px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(102,126,234,0.3); }
        .btn-export { margin-left: 10px; background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); }
        .btn-secondary { margin-left: 10px; background: linear-gradient(135deg, #6c757d 0%, #495057 100%); }
        .result-section { background: white; border-radius: 8px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .sql-display { background: #f5f7fa; padding: 12px; border-radius: 6px; font-family: monospace; font-size: 13px; margin: 12px 0; overflow-x: auto; position: relative; }
        .sql-actions { margin-top: 10px; display: flex; gap: 10px; align-items: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #f0f0f0; font-size: 13px; }
        th { background: #f5f7fa; font-weight: 600; }
        .message { padding: 12px; border-radius: 6px; margin-bottom: 12px; }
        .message.error { background: #ffebee; color: #c62828; }
        .message.success { background: #e8f5e9; color: #2e7d32; }
        .message.warning { background: #fff3e0; color: #ef6c00; }
        .chart-section { margin-top: 20px; padding: 16px; background: #f9f9f9; border-radius: 6px; }
        .chart-tabs { display: flex; gap: 10px; margin-bottom: 12px; }
        .chart-tab { padding: 8px 16px; background: white; border: 1px solid #ddd; border-radius: 4px; cursor: pointer; }
        .chart-tab.active { background: #667eea; color: white; border-color: #667eea; }
        .chart-container { min-height: 300px; background: white; padding: 16px; border-radius: 6px; }
        .options-row { display: flex; gap: 20px; margin-top: 12px; flex-wrap: wrap; }
        .option-item { display: flex; align-items: center; gap: 8px; }
        .option-item label { font-size: 14px; color: #555; cursor: pointer; }
        .option-item input[type="checkbox"] { cursor: pointer; }
        select { padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="query-container">
        <div class="input-section">
            <h3>🔍 SQL生成器</h3>
            
            <!-- 数据源选择 -->
            <div style="margin-bottom: 15px;">
                <label style="display:block;margin-bottom:5px;color:#555;font-weight:500;">📊 选择数据源：</label>
                <select id="datasourceSelect" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:5px;font-size:14px;">
                    <option value="">-- 请选择数据源 --</option>
                </select>
            </div>
            
            <textarea id="queryInput" placeholder="例如：查看上个月订单数量"></textarea>
            
            <button class="btn" onclick="generateSQL()">🚀 生成SQL</button>
        </div>
        <div class="result-section" id="resultSection" style="display:none;">
            <h3>SQL生成结果</h3>
            <div id="messages"></div>
            <div id="sqlDisplay"></div>
        </div>
    </div>
    <script>
        const token = localStorage.getItem('token');
        const userInfo = JSON.parse(localStorage.getItem('userInfo') || '{}');
        let currentSQL = null;
        let lastQuery = null;  // ✅ 保存最后一次的查询
        
        // 页面加载时获取数据源列表
        window.onload = async function() {
            await loadDatasources();
        };
        
        // 加载数据源列表
        async function loadDatasources() {
            try {
                const response = await fetch('/api/admin/datasource/list', {
                    headers: { 'Authorization': token }
                });
                const result = await response.json();
                
                if (result.code === 200 && result.data) {
                    const select = document.getElementById('datasourceSelect');
                    
                    if (result.data.length === 0) {
                        select.innerHTML = '<option value="">暂无可用数据源，请联系管理员配置</option>';
                        return;
                    }
                    
                    select.innerHTML = '<option value="">-- 请选择数据源 --</option>' + 
                        result.data.map(ds => `<option value="${ds.id}">${escapeHtml(ds.name)} (${escapeHtml(ds.host)})</option>`).join('');
                }
            } catch (error) {
                console.error('加载数据源失败:', error);
            }
        }
        
        async function generateSQL() {
            const query = document.getElementById('queryInput').value.trim();
            if (!query) { alert('请输入查询内容'); return; }
            
            // ✅ 保存查询问题
            lastQuery = query;
            
            const datasourceId = document.getElementById('datasourceSelect').value;
            if (!datasourceId) {
                alert('⚠️ 请先选择数据源');
                return;
            }
            
            const resultSection = document.getElementById('resultSection');
            const messagesDiv = document.getElementById('messages');
            const sqlDisplay = document.getElementById('sqlDisplay');
            
            resultSection.style.display = 'block';
            messagesDiv.innerHTML = '<div class="message success">正在生成SQL...</div>';
            sqlDisplay.innerHTML = '';
            currentSQL = null;
            
            try {
                // ✅ 调用 Agent 对话接口生成 SQL（离线模式）
                const response = await fetch('/api/agent/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': token },
                    body: JSON.stringify({ 
                        message: query,
                        datasourceId: parseInt(datasourceId),
                        sessionId: 'datamind_' + (userInfo.userId || 'default'),
                        context: { sqlOnly: true }  // ✅ 离线模式：仅生成SQL
                    })
                });
                const result = await response.json();
                
                if (result.code === 200 && result.data) {
                    const data = result.data;
                    
                    // ✅ 根据type字段路由响应
                    if (data.type === 'clarification') {
                        messagesDiv.innerHTML = `<div class="message warning">💬 ${data.message || '请补充更多信息'}</div>`;
                        sqlDisplay.innerHTML = '';
                        return;
                    }
                    
                    if (data.type === 'error') {
                        messagesDiv.innerHTML = `<div class="message error">❌ ${data.message || '查询失败'}</div>`;
                        sqlDisplay.innerHTML = '';
                        return;
                    }
                    
                    // ✅ 处理成功响应（包含SQL）
                    let messagesHtml = '';
                    
                    // ✅ 离线模式：使用sql字段；在线模式：可能使用generatedSQL
                    const generatedSQL = data.sql || data.generatedSQL;
                    
                    if (generatedSQL) {
                        currentSQL = generatedSQL;
                        messagesHtml += `<div class="message success">✅ SQL生成成功</div>`;
                        
                        // ✅ 检查风险等级，高风险时弹框提示
                        if (data.riskLevel === 'HIGH') {
                            const riskReason = data.riskReason || 'SQL存在高风险';
                            const optimizationSuggestion = data.optimizationSuggestion || '';
                            
                            const confirmExecute = confirm(
                                `⚠️ SQL风险评估：高风险\n\n` +
                                `原因：${riskReason}\n\n` +
                                `${optimizationSuggestion ? '优化建议：' + optimizationSuggestion + '\n\n' : ''}` +
                                `是否仍要查看此SQL？`
                            );
                            
                            if (!confirmExecute) {
                                messagesDiv.innerHTML = messagesHtml + '<div class="message error">❌ 已取消，SQL风险过高</div>';
                                sqlDisplay.innerHTML = '';
                                return;
                            }
                        }
                        
                        // 显示SQL和操作按钮
                        sqlDisplay.innerHTML = `
                            <strong>生成的SQL:</strong>
                            <div class="sql-display">${escapeHtml(generatedSQL)}</div>
                            <div class="sql-actions">
                                <button class="btn btn-secondary" onclick="copySQL()">📋 复制SQL</button>
                                <button class="btn btn-secondary" onclick="editSQL()">✏️ 编辑SQL</button>
                                <button class="btn btn-success" onclick="submitFeedback(5)">⭐ 好评</button>
                                <button class="btn btn-warning" onclick="submitFeedback(1)">⚠️ 反馈问题</button>
                            </div>
                        `;
                        
                        messagesDiv.innerHTML = messagesHtml;
                    } else {
                        messagesDiv.innerHTML = messagesHtml + '<div class="message error">SQL生成失败</div>';
                    }
                } else {
                    messagesDiv.innerHTML = `<div class="message error">请求失败: ${result.message || '未知错误'}</div>`;
                }
            } catch (error) {
                messagesDiv.innerHTML = `<div class="message error">请求失败: ${error.message}</div>`;
            }
        }
        
        // 复制SQL
        function copySQL() {
            if (!currentSQL) return;
            navigator.clipboard.writeText(currentSQL).then(() => {
                alert('✅ SQL已复制到剪贴板');
            }).catch(() => {
                alert('❌ 复制失败');
            });
        }
        
        // 编辑SQL
        function editSQL() {
            if (!currentSQL) return;
            const newSQL = prompt('编辑SQL:', currentSQL);
            if (newSQL !== null && newSQL.trim()) {
                currentSQL = newSQL.trim();
                // 更新显示
                const sqlDisplay = document.querySelector('.sql-display');
                if (sqlDisplay) {
                    sqlDisplay.textContent = currentSQL;
                }
                alert('✅ SQL已更新');
            }
        }
        
        // ✅ 提交SQL反馈
        async function submitFeedback(rating) {
            if (!currentSQL || !lastQuery) {
                alert('❌ 没有可反馈的SQL');
                return;
            }
            
            let feedbackText = '';
            
            // 低分反馈需要填写原因
            if (rating <= 3) {
                feedbackText = prompt('请说明SQL的问题（可选）：\n- 表选择错误\n- 字段不正确\n- 逻辑错误\n- 其他问题');
                if (feedbackText === null) {
                    return; // 用户取消
                }
            } else {
                feedbackText = 'SQL生成准确';
            }
            
            try {
                const token = localStorage.getItem('token');
                if (!token) {
                    alert('❌ 请先登录');
                    return;
                }
                
                const response = await fetch('/api/feedback/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': token
                    },
                    body: JSON.stringify({
                        rating: rating,
                        feedbackText: feedbackText,
                        question: lastQuery,
                        generatedSql: currentSQL,
                        executedSql: currentSQL,  // 离线模式未执行，使用生成的SQL
                        executionSuccess: null,  // 离线模式未知
                        sessionId: 'datamind_' + (userInfo.userId || 'default')
                    })
                });
                
                const result = await response.json();
                
                if (result.code === 200) {
                    alert(rating >= 4 ? '✅ 感谢您的好评！' : '✅ 感谢您的反馈，我们会持续改进！');
                } else {
                    alert('❌ 提交失败: ' + result.message);
                }
            } catch (error) {
                console.error('提交反馈失败:', error);
                alert('❌ 网络错误，请稍后重试');
            }
        }
        
        // HTML转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
