<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataMind AI - 修改密码</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Microsoft YaHei', Arial, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            background: white;
            border-radius: 15px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        
        h2 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .subtitle {
            color: #999;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .alert {
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }
        
        .alert-success { 
            background: #d4edda; 
            color: #155724; 
            border: 1px solid #c3e6cb; 
            display: block;
        }
        
        .alert-error { 
            background: #f8d7da; 
            color: #721c24; 
            border: 1px solid #f5c6cb;
            display: block;
        }
        
        .info-box {
            background: #f0f4ff;
            border-left: 4px solid #667eea;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 4px;
            font-size: 13px;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔐 修改密码</h2>
        <p class="subtitle">为了账户安全，请定期更换密码</p>
        
        <div id="message"></div>
        
        <div class="info-box">
            💡 提示：密码长度建议不少于6位，包含字母和数字组合更安全
        </div>
        
        <div class="form-group">
            <label for="oldPassword">原密码 *</label>
            <input type="password" id="oldPassword" placeholder="请输入当前密码">
        </div>
        
        <div class="form-group">
            <label for="newPassword">新密码 *</label>
            <input type="password" id="newPassword" placeholder="请输入新密码">
        </div>
        
        <div class="form-group">
            <label for="confirmPassword">确认新密码 *</label>
            <input type="password" id="confirmPassword" placeholder="请再次输入新密码">
        </div>
        
        <button class="btn" onclick="changePassword()">✅ 确认修改</button>
    </div>
    
    <script>
        const token = localStorage.getItem('token');
        
        // 修改密码
        async function changePassword() {
            const oldPassword = document.getElementById('oldPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            // 验证输入
            if (!oldPassword || !newPassword || !confirmPassword) {
                showMessage('请填写所有字段', 'error');
                return;
            }
            
            if (newPassword.length < 6) {
                showMessage('新密码长度不能少于6位', 'error');
                return;
            }
            
            if (newPassword !== confirmPassword) {
                showMessage('两次输入的新密码不一致', 'error');
                return;
            }
            
            if (oldPassword === newPassword) {
                showMessage('新密码不能与原密码相同', 'error');
                return;
            }
            
            try {
                const response = await fetch('/api/auth/password/change', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': token
                    },
                    body: JSON.stringify({
                        oldPassword,
                        newPassword
                    })
                });
                
                const result = await response.json();
                
                if (result.code === 200) {
                    showMessage('✅ 密码修改成功！请使用新密码重新登录', 'success');
                    
                    // 清空表单
                    document.getElementById('oldPassword').value = '';
                    document.getElementById('newPassword').value = '';
                    document.getElementById('confirmPassword').value = '';
                    
                    // 3秒后跳转到登录页
                    setTimeout(() => {
                        localStorage.removeItem('token');
                        localStorage.removeItem('userInfo');
                        window.location.href = '/login.html';
                    }, 3000);
                } else {
                    showMessage(`❌ ${result.message}`, 'error');
                }
            } catch (error) {
                showMessage('❌ 网络错误', 'error');
                console.error('修改密码失败:', error);
            }
        }
        
        // 显示消息
        function showMessage(message, type) {
            const msgDiv = document.getElementById('message');
            msgDiv.className = `alert alert-${type}`;
            msgDiv.textContent = message;
            
            if (type === 'success') {
                setTimeout(() => {
                    msgDiv.className = 'alert';
                    msgDiv.textContent = '';
                }, 3000);
            }
        }
        
        // 回车键提交
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                changePassword();
            }
        });
    </script>
</body>
</html>
