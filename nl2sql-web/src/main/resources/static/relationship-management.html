<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表关联关系管理</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto 40px; /* ✅ 底部留足空间 */
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: white;
            color: #333;
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e8e8e8;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
        }
        
        .header h1 {
            font-size: 20px;
            font-weight: 600;
            color: #333;
        }
        
        .header-actions {
            display: flex;
            gap: 12px;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102,126,234,0.3);
        }
        
        .btn-secondary {
            background: #f5f7fa;
            color: #667eea;
            border: 1px solid #e0e0e0;
        }
        
        .btn-secondary:hover {
            background: #e8eeff;
            border-color: #667eea;
        }
        
        .btn-danger {
            background: #ff4d4f;
            color: white;
        }
        
        .btn-danger:hover {
            background: #ff7875;
        }
        
        .content {
            padding: 32px;
        }
        
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        
        .datasource-selector {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .datasource-selector label {
            font-weight: 500;
            color: #333;
        }
        
        .datasource-selector select {
            padding: 8px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }
        
        .datasource-selector select:focus {
            border-color: #667eea;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }
        
        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #f0f0f0;
        }
        
        th {
            background: #f5f7fa;
            font-weight: 600;
            color: #555;
        }
        
        tr:hover {
            background: #fafafa;
        }
        
        .arrow {
            color: #667eea;
            font-weight: bold;
        }
        
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .badge-success {
            background: #e8f5e9;
            color: #2e7d32;
        }
        
        .badge-warning {
            background: #fff3e0;
            color: #ef6c00;
        }
        
        .actions {
            display: flex;
            gap: 8px;
        }
        
        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
        }
        
        /* Modal */
        .modal-overlay {
            display: none;
            position: absolute; /* ✅ 改为absolute，相对于body定位 */
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal-overlay.active {
            display: flex;
            position: absolute !important; /* ✅ 强制absolute，防止被其他CSS覆盖 */
        }
        
        .modal {
            background: white;
            border-radius: 12px;
            width: 90%;
            max-width: 700px;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-header h2 {
            font-size: 18px;
            color: #333;
        }
        
        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #999;
        }
        
        .modal-close:hover {
            color: #333;
        }
        
        .modal-body {
            padding: 24px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
        }
        
        .form-group select,
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }
        
        .form-group select:focus,
        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #667eea;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        
        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }
        
        .btn-cancel {
            background: #f5f5f5;
            color: #333;
        }
        
        .btn-cancel:hover {
            background: #e0e0e0;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
        
        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        
        /* ✅ 冲突行样式 */
        .conflict-row {
            background: #fff3e0 !important;
            border-left: 4px solid #ff9800;
        }
        
        .conflict-badge {
            display: inline-block;
            padding: 2px 8px;
            background: #ff9800;
            color: white;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            margin-right: 8px;
        }
        
        .conflict-compare {
            display: flex;
            gap: 16px;
            font-size: 13px;
        }
        
        .conflict-item {
            flex: 1;
            padding: 8px;
            border-radius: 4px;
            background: rgba(255,255,255,0.7);
        }
        
        .conflict-item label {
            display: block;
            font-weight: 600;
            color: #666;
            margin-bottom: 4px;
            font-size: 11px;
        }
        
        .rule-based label { color: #4caf50; }
        .llm-based label { color: #2196f3; }
        
        /* ✅ 冲突确认模态框 */
        .conflict-modal {
            max-width: 900px;
        }
        
        .conflict-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }
        
        .conflict-table th,
        .conflict-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .conflict-table th {
            background: #f5f7fa;
            font-weight: 600;
        }
        
        .radio-group {
            display: flex;
            gap: 16px;
        }
        
        .radio-option {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 4px;
            transition: background 0.2s;
        }
        
        .radio-option:hover {
            background: #f0f0f0;
        }
        
        .radio-option input[type="radio"] {
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔗 表关联关系管理</h1>
            <div class="header-actions">
                <button class="btn btn-secondary" onclick="openSQLParseModal()">📝 从SQL提取</button>
                <button class="btn btn-secondary" onclick="autoDetect()">🤖 自动推断</button>
                <button class="btn btn-primary" onclick="openCreateModal()">+ 新增关联</button>
            </div>
        </div>
        
        <div class="content">
            <div class="toolbar">
                <div class="datasource-selector">
                    <label>数据源：</label>
                    <select id="datasourceSelect" onchange="loadRelationships()">
                        <option value="">请选择数据源</option>
                    </select>
                </div>
                <div>
                    <span id="totalCount" style="color: #666;">共 0 条关联关系</span>
                </div>
            </div>
            
            <table id="relationshipTable">
                <thead>
                    <tr>
                        <th>源表</th>
                        <th>源字段</th>
                        <th></th>
                        <th>目标表</th>
                        <th>目标字段</th>
                        <th>描述</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="8" class="empty-state">
                            <div class="empty-state-icon">📋</div>
                            <div>请先选择数据源</div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <!-- ✅ 创建/编辑模态框 - 在 iframe 内部显示 -->
    <div id="relationshipModalOverlay" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;justify-content:center;align-items:center;">
        <div style="background:white;border-radius:12px;max-width:800px;width:90%;max-height:90vh;overflow-y:auto;box-shadow:0 4px 20px rgba(0,0,0,0.3);">
            <div id="relationshipModalContent"></div>
        </div>
    </div>
    
    <!-- ✅ 自动推断结果模态框 - 在 iframe 内部显示 -->
    <div id="autoDetectModalOverlay" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1001;justify-content:center;align-items:center;">
        <div style="background:white;border-radius:12px;max-width:1000px;width:95%;max-height:90vh;overflow-y:auto;box-shadow:0 4px 20px rgba(0,0,0,0.3);">
            <div style="padding:20px 24px;border-bottom:1px solid #e0e0e0;display:flex;justify-content:space-between;align-items:center;">
                <h2 style="font-size:18px;color:#333;margin:0;">🤖 自动推断结果</h2>
                <button onclick="hideAutoDetectModal()" style="background:none;border:none;font-size:24px;cursor:pointer;color:#999;">&times;</button>
            </div>
            <div style="padding:24px;">
                <table style="width:100%;border-collapse:collapse;">
                    <thead>
                        <tr style="background:#f8f9fa;">
                            <th style="padding:12px;text-align:left;border-bottom:2px solid #dee2e6;">源表。字段</th>
                            <th style="padding:12px;text-align:center;border-bottom:2px solid #dee2e6;">→</th>
                            <th style="padding:12px;text-align:left;border-bottom:2px solid #dee2e6;">目标表。字段</th>
                            <th style="padding:12px;text-align:left;border-bottom:2px solid #dee2e6;">描述</th>
                            <th style="padding:12px;text-align:center;border-bottom:2px solid #dee2e6;">操作</th>
                        </tr>
                    </thead>
                    <tbody id="autoDetectBody">
                        <tr><td colspan="5" style="text-align:center;padding:20px;color:#999;">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
            <div style="padding:16px 24px;border-top:1px solid #e0e0e0;display:flex;justify-content:space-between;align-items:center;">
                <div style="color:#666;">
                    <span id="autoDetectTotalCount">共 0 条</span>
                    <span id="conflictCount" style="display:none;margin-left:12px;color:#dc3545;">⚠️ 冲突 0 条</span>
                </div>
                <div style="display:flex;gap:12px;">
                    <button onclick="hideAutoDetectModal()" style="padding:10px 20px;background:#f5f5f5;color:#333;border:none;border-radius:6px;cursor:pointer;">取消</button>
                    <button onclick="saveAutoDetectedRelationships()" style="padding:10px 20px;background:linear-gradient(135deg, #667eea 0%, #764ba2 100%);color:white;border:none;border-radius:6px;cursor:pointer;">全部保存</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- ✅ 隐藏的表单模板（用于克隆） -->
    <div id="relationshipFormTemplate" style="display:none;">
        <form id="relationshipForm">
            <div style="margin-bottom:20px;">
                <label style="display:block;margin-bottom:8px;font-weight:600;color:#555;">源表：</label>
                <select id="sourceTable" onchange="loadSourceColumns()" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;font-size:14px;">
                    <option value="">请选择表</option>
                </select>
            </div>
            
            <div style="margin-bottom:20px;">
                <label style="display:block;margin-bottom:8px;font-weight:600;color:#555;">源字段：</label>
                <select id="sourceColumn" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;font-size:14px;">
                    <option value="">请选择字段</option>
                </select>
            </div>
            
            <div style="margin-bottom:20px;">
                <label style="display:block;margin-bottom:8px;font-weight:600;color:#555;">目标表：</label>
                <select id="targetTable" onchange="loadTargetColumns()" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;font-size:14px;">
                    <option value="">请选择表</option>
                </select>
            </div>
            
            <div style="margin-bottom:20px;">
                <label style="display:block;margin-bottom:8px;font-weight:600;color:#555;">目标字段：</label>
                <select id="targetColumn" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;font-size:14px;">
                    <option value="">请选择字段</option>
                </select>
            </div>

            <div style="margin-bottom:20px;">
                <label style="display:block;margin-bottom:8px;font-weight:600;color:#555;">关联描述：</label>
                <textarea id="description" rows="3" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;font-size:14px;resize:vertical;background:#f9f9f9;color:#666;" placeholder="选择字段后自动生成" readonly></textarea>
            </div>
        </form>
    </div>
    
    <h2 id="modalTitle" style="display:none;">创建关联关系</h2>
    
    <!-- SQL解析模态框 - 通过postMessage通知父窗口显示 -->
    
    <!-- 自动推断结果预览模态框 - 通过postMessage通知父窗口显示 -->
    
    <script>
        const token = localStorage.getItem('token');
        let currentDatasourceId = null;
        let allTables = [];
        
        // 初始化
        window.onload = function() {
            loadDatasources();
        };
        
        // ✅ 显示加载遮罩层
        function showLoadingMask(message) {
            const mask = document.createElement('div');
            mask.id = 'loadingMask';
            mask.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.6);
                display: flex;
                justify-content: center;
                align-items: center;
                z-index: 99999;
            `;
            
            mask.innerHTML = `
                <div style="background: white; padding: 30px 40px; border-radius: 12px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.3);">
                    <div style="width: 50px; height: 50px; border: 4px solid #f3f3f3; border-top: 4px solid #667eea; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px;"></div>
                    <div style="color: #333; font-size: 16px; font-weight: 500;">${message}</div>
                </div>
                <style>
                    @keyframes spin {
                        0% { transform: rotate(0deg); }
                        100% { transform: rotate(360deg); }
                    }
                </style>
            `;
            
            document.body.appendChild(mask);
        }
        
        // ✅ 隐藏加载遮罩层
        function hideLoadingMask() {
            const mask = document.getElementById('loadingMask');
            if (mask) {
                mask.remove();
            }
        }
        
        // 加载数据源列表
        async function loadDatasources() {
            try {
                const response = await fetch('/api/admin/datasource/list', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const result = await response.json();
                
                if (result.code === 200) {
                    const select = document.getElementById('datasourceSelect');
                    result.data.forEach(ds => {
                        const option = document.createElement('option');
                        option.value = ds.id;
                        option.textContent = ds.name;
                        select.appendChild(option);
                    });
                    
                    // 默认选中第一个
                    if (result.data.length > 0) {
                        select.value = result.data[0].id;
                        loadRelationships();
                    }
                }
            } catch (error) {
                console.error('加载数据源失败:', error);
            }
        }
        
        // 加载关联关系
        async function loadRelationships() {
            const datasourceId = document.getElementById('datasourceSelect').value;
            if (!datasourceId) return;
            
            currentDatasourceId = datasourceId;
            
            try {
                const response = await fetch(`/api/relationships?datasourceId=${datasourceId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const result = await response.json();
                
                if (result.code === 200) {
                    renderTable(result.data);
                    document.getElementById('totalCount').textContent = `共 ${result.data.length} 条关联关系`;
                }
            } catch (error) {
                console.error('加载关联关系失败:', error);
                alert('加载失败: ' + error.message);
            }
        }
        
        // 渲染表格
        function renderTable(relationships) {
            const tbody = document.getElementById('tableBody');
            
            if (relationships.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="8" class="empty-state">
                            <div class="empty-state-icon">🔍</div>
                            <div>暂无关联关系，点击“新增关联”添加</div>
                        </td>
                    </tr>
                `;
                return;
            }
                        
            tbody.innerHTML = relationships.map(rel => `
                <tr>
                    <td><strong>${rel.sourceTable}</strong></td>
                    <td>${rel.sourceColumn}</td>
                    <td class="arrow">→</td>
                    <td><strong>${rel.targetTable}</strong></td>
                    <td>${rel.targetColumn}</td>
                    <td>${rel.description || '-'}</td>
                    <td>${rel.isActive === 1 ? '<span class="badge badge-success">启用</span>' : '<span class="badge badge-warning">禁用</span>'}</td>
                    <td class="actions">
                        <button class="btn btn-small btn-danger" onclick="deleteRelationship(${rel.id})">删除</button>
                    </td>
                </tr>
            `).join('');
        }
        
        // ✅ 打开创建模态框 - 先在 iframe 内部显示模态框，再加载表列表
        async function openCreateModal() {
            // ✅ 检查是否已选择数据源
            if (!currentDatasourceId) {
                alert('请先在页面顶部选择数据源');
                return;
            }
            
            // 先显示模态框
            await showRelationshipModalInIframe('create');
            
            // 等待模态框显示后再加载表列表（使用页面顶部已选择的数据源）
            await loadTables();
        }
        
        // ✅ 在 iframe 内部显示创建/编辑模态框
        async function showRelationshipModalInIframe(modalType) {
            // ✅ 检查是否已选择数据源
            if (!currentDatasourceId) {
                alert('请先在页面顶部选择数据源');
                return;
            }
            
            const overlay = document.getElementById('relationshipModalOverlay');
            const contentDiv = document.getElementById('relationshipModalContent');
            const formTemplate = document.getElementById('relationshipFormTemplate');
            
            if (!formTemplate) {
                console.error('表单模板未找到');
                return;
            }
            
            // 从模板克隆表单
            const form = formTemplate.querySelector('#relationshipForm').cloneNode(true);
            form.style.display = 'block';
            
            const title = modalType === 'create' ? '创建关联关系' : '编辑关联关系';
            
            const modalHTML = `
                <div class="modal-header" style="padding:20px 24px;border-bottom:1px solid #e0e0e0;display:flex;justify-content:space-between;align-items:center;">
                    <h2 style="font-size:18px;color:#333;margin:0;">${title}</h2>
                    <button onclick="hideRelationshipModal()" style="background:none;border:none;font-size:24px;cursor:pointer;color:#999;">&times;</button>
                </div>
                <div class="modal-body" style="padding:24px;">
                </div>
                <div class="modal-footer" style="padding:16px 24px;border-top:1px solid #e0e0e0;display:flex;justify-content:flex-end;gap:12px;">
                    <button onclick="hideRelationshipModal()" style="padding:10px 20px;background:#f5f5f5;color:#333;border:none;border-radius:6px;cursor:pointer;">取消</button>
                    <button onclick="saveRelationship()" style="padding:10px 20px;background:linear-gradient(135deg, #667eea 0%, #764ba2 100%);color:white;border:none;border-radius:6px;cursor:pointer;">保存</button>
                </div>
            `;
            
            contentDiv.innerHTML = modalHTML;
            
            // 将表单添加到 modal-body
            const modalBody = contentDiv.querySelector('.modal-body');
            modalBody.appendChild(form);
            
            overlay.style.display = 'flex';
        }
        
        // ✅ 隐藏模态框
        function hideRelationshipModal() {
            const overlay = document.getElementById('relationshipModalOverlay');
            if (overlay) {
                overlay.style.display = 'none';
            }
        }
        
        // ✅ 显示 SQL 解析模态框
        function showSQLParseModalInIframe(sqlValue) {
            const overlay = document.getElementById('relationshipModalOverlay');
            const content = document.getElementById('relationshipModalContent');
            
            const modalHTML = `
                <div class="modal-header" style="padding:20px 24px;border-bottom:1px solid #e0e0e0;display:flex;justify-content:space-between;align-items:center;">
                    <h2 style="font-size:18px;color:#333;margin:0;">从 SQL 提取关联关系</h2>
                    <button onclick="hideRelationshipModal()" style="background:none;border:none;font-size:24px;cursor:pointer;color:#999;">&times;</button>
                </div>
                <div class="modal-body" style="padding:24px;">

        // ✅ 解析 SQL 并显示结果

            if (!sql || !sql.trim()) {
                alert('请输入 SQL 语句');
                return;
            }
            
            showLoadingMask('正在解析 SQL...');
            
            try {
                const response = await fetch('/api/relationships/parse-sql', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        datasourceId: currentDatasourceId,
                        sql: sql
                    })
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    const resultDiv = document.getElementById('sqlParseResult');
                    resultDiv.style.display = 'block';
                    resultDiv.innerHTML = `

                    `;

                alert('解析失败：' + error.message);

                hideLoadingMask();

        // 自动生成描述
        function autoGenerateDescription() {
            const sourceTable = document.getElementById('sourceTable').value;
            const sourceColumn = document.getElementById('sourceColumn').value;
            const targetTable = document.getElementById('targetTable').value;
            const targetColumn = document.getElementById('targetColumn').value;
            
            console.log('[autoGenerateDescription]', { sourceTable, sourceColumn, targetTable, targetColumn });
            
            // 只有当所有字段都选择后才生成
            if (sourceTable && sourceColumn && targetTable && targetColumn) {

                const targetTableObj = allTables.find(t => t.table_name === targetTable);

                const sourceTableComment = sourceTableObj && sourceTableObj.table_comment ? sourceTableObj.table_comment : sourceTable;
                const targetTableComment = targetTableObj && targetTableObj.table_comment ? targetTableObj.table_comment : targetTable;
                
                // 标准格式：{源表名}通过{源字段}关联{目标表名}
                const description = `${sourceTableComment}通过${sourceColumn}关联${targetTableComment}`;

        // ✅ 防重检查：检查是否已存在相同的关联关系（包括双向）

                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const result = await response.json();
                
                if (result.code === 200) {
                    if (result.data.exists) {
                        const direction = result.data.reverseDirection ? '反向' : '相同';
                        alert(`关联关系已存在（${direction}）：${result.data.existingRelationship}`);
                        return true; // 存在重复
                    }
                    return false; // 不存在重复
                }
                return false;
            } catch (error) {
                console.error('防重检查失败:', error);
                return false; // 检查失败，允许保存
            }
        }

        // 自动推断
        async function autoDetect() {
            if (!currentDatasourceId) {
                alert('请先选择数据源');
                return;
            }
            
            // ✅ 检查是否已有关联关系
            try {

                    headers: { 'Authorization': `Bearer ${token}` }

                if (checkResult.code === 200 && checkResult.data && checkResult.data.length > 0) {

                    const confirmOverwrite = confirm(

                        `自动推断将覆盖现有元数据，是否继续？`
                    );
                    
                    if (!confirmOverwrite) {
                        return; // 用户取消
                    }
                }
            } catch (error) {
                console.error('检查关联关系失败:', error);
            }
            
            // ✅ 显示加载遮罩层
            showLoadingMask('正在自动推断表关联关系，请稍候...');

                const response = await fetch(`/api/relationships/auto-detect?datasourceId=${currentDatasourceId}`, {
                    method: 'POST',

                });

                // ✅ 隐藏加载遮罩层
                hideLoadingMask();
                
                // ✅ 调试日志
                console.log('[AutoDetect] result:', result);
                console.log('[AutoDetect] result.data:', result.data);
                console.log('[AutoDetect] typeof result.data:', typeof result.data);
                console.log('[AutoDetect] Array.isArray(result.data):', Array.isArray(result.data));
                
                if (result.code === 200) {
                    // ✅ 修复：支持数组格式和对象格式
                    let relationships;
                    
                    if (Array.isArray(result.data)) {
                        // 数组格式：result.data = [{sourceTable, targetTable, ...}]
                        relationships = result.data;
                    } else if (result.data && result.data.relationships) {
                        // 对象格式：{data: {relationships: [...]}}
                        relationships = result.data.relationships;
                    } else {
                        alert('推断结果格式错误');

        // 解析SQL（智能提取，带优化建议）
        async function parseSQL() {
            const sql = document.getElementById('sqlInput').value.trim();
            if (!sql) {
                alert('请输入SQL语句');
                return;
            }
            
            if (!currentDatasourceId) {
                alert('请先选择数据源');
                return;
            }
            
            // ✅ 验证 SQL 是否包含 JOIN 或子查询
            const upperSQL = sql.toUpperCase();
            const hasJoin = upperSQL.includes('JOIN');
            const hasSubquery = upperSQL.includes('IN (SELECT') || 
                               upperSQL.includes('EXISTS (SELECT') || 
                               upperSQL.includes('= (SELECT');
            
            if (!hasJoin && !hasSubquery) {
                alert('❌ SQL必须包含JOIN或子查询才能提取关联关系\n\n示例：\n- SELECT * FROM orders o JOIN users u ON o.user_id = u.id\n- SELECT * FROM orders WHERE user_id IN (SELECT id FROM users)');
                return;
            }
            
            try {
                // 使用智能提取接口（带优化建议）
                const response = await fetch('/api/relationships/extract-with-suggestions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        sql: sql,
                        datasourceId: parseInt(currentDatasourceId)
                    })
                });
                const result = await response.json();
                
                if (result.code === 200) {
                    const data = result.data;
                    
                    // 显示优化建议
                    if (data.suggestions && data.suggestions.length > 0) {
                        showSuggestions(data.suggestions);
                    }
                    
                    // 如果提取成功，显示结果
                    if (data.success && data.relationships && data.relationships.length > 0) {
                        renderExtractedRelationships(data.relationships);
                    } else if (!data.success) {
                        // 提取失败，显示错误和建议
                        alert('❌ ' + (data.error || '提取失败') + '\n\n' + (data.suggestions ? data.suggestions.join('\n') : ''));
                        document.getElementById('parseResults').style.display = 'none';
                    } else {
                        alert('⚠️ 未提取到关联关系，请检查 SQL 语法是否正确');
                        document.getElementById('parseResults').style.display = 'none';
                    }
                } else {
                    alert('❌ ' + (result.message || '解析失败'));
                    document.getElementById('parseResults').style.display = 'none';
                }
            } catch (error) {
                console.error('解析SQL失败:', error);
                alert('解析失败: ' + error.message);
            }
        }
        
        // 显示优化建议
        function showSuggestions(suggestions) {
            const suggestionHtml = suggestions.map(s => {
                // 将换行符转换为<br>

            // 创建提示框

            modal.innerHTML = `

                <div style="line-height: 1.8; color: #555; font-size: 14px;">

                <div style="margin-top: 20px; text-align: right;">

                            style="padding: 8px 20px; background: #667eea; color: white; border: none; border-radius: 6px; cursor: pointer;">
                        我了解了，继续提取

            `;
            
            // 添加遮罩层
            const overlay = document.createElement('div');
            overlay.id = 'modalOverlay';
            overlay.style.cssText = `
                position: fixed;
                top: 0;

        // ✅ 显示自动推断结果（支持冲突检测）
        function showAutoDetectResults(response) {
            console.log('[showAutoDetectResults] 被调用');
            
            // ✅ 处理后端返回的包装格式
            let relationships = [];
            let conflicts = [];
            let hasConflicts = false;
            
            if (response._hasConflicts) {
                // 有冲突的特殊格式
                const data = response.data;
                relationships = data.relationships || [];
                conflicts = data.conflicts || [];
                hasConflicts = data.hasConflicts || false;
                
                console.log('[showAutoDetectResults] 检测到冲突:', conflicts.length);
            } else {
                // 普通格式
                relationships = Array.isArray(response) ? response : (response.data || []);
            }
            
            if (!relationships || relationships.length === 0) {
                alert('未推断到任何关联关系');
                return;
            }
            
            // ✅ 保存数据和冲突信息
            window.autoDetectedRelationships = relationships;
            window.autoDetectConflicts = conflicts;
            window.autoDetectHasConflicts = hasConflicts;
            
            console.log('[showAutoDetectResults] 已保存到 window.autoDetectedRelationships, conflicts:', conflicts.length);
            
            // ✅ 在 iframe 内部显示模态框
            showAutoDetectModal();
            
            // 渲染表格
            renderAutoDetectTable();
            
            console.log('[showAutoDetectResults] 完成');
        }
        
        // ✅ 显示自动推断模态框
        function showAutoDetectModal() {
            const overlay = document.getElementById('autoDetectModalOverlay');
            if (overlay) {
                overlay.style.display = 'flex';
            }
        }
        
        // ✅ 隐藏自动推断模态框
        function hideAutoDetectModal() {
            const overlay = document.getElementById('autoDetectModalOverlay');
            if (overlay) {
                overlay.style.display = 'none';
            }
        }
        
        // 渲染自动推断表格（支持冲突高亮）
        function renderAutoDetectTable() {
            console.log('[renderAutoDetectTable] 开始渲染');
            
            const tbody = document.getElementById('autoDetectBody');
            const relationships = window.autoDetectedRelationships || [];
            const conflicts = window.autoDetectConflicts || [];
            
            // ✅ 构建冲突映射表（key -> conflict对象）
            const conflictMap = {};
            conflicts.forEach(conflict => {
                conflictMap[conflict.key] = conflict;
            });
            
            if (relationships.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 20px; color: #999;">暂无数据</td></tr>';
                updateTotalCount();
                return;
            }
            
            const html = relationships.map((rel, index) => {
                const key = `${rel.sourceTable}.${rel.sourceColumn}->${rel.targetTable}.${rel.targetColumn}`;
                const conflict = conflictMap[key];
                const isConflict = !!conflict;
                
                let rowClass = isConflict ? 'conflict-row' : '';
                let sourceCell = `<strong>${rel.sourceTable}</strong>.${rel.sourceColumn}`;
                let descriptionCell = rel.description || '-';
                let actionCell = `<button class="btn btn-small btn-danger" onclick="removeAutoDetectItem(${index})">删除</button>`;
                
                // ✅ 如果是冲突行，显示对比信息
                if (isConflict) {
                    sourceCell = `
                        <span class="conflict-badge">⚠️ 冲突</span>
                        <strong>${rel.sourceTable}</strong>.${rel.sourceColumn}
                    `;
                    
                    descriptionCell = `
                        <div class="conflict-compare">
                            <div class="conflict-item rule-based">
                                <label>规则引擎:</label>
                                <div>置信度: ${conflict.ruleBased.confidence || '-'}</div>
                                <div style="font-size: 12px; color: #999; margin-top: 4px;">${conflict.ruleBased.description || '-'}</div>
                            </div>
                            <div class="conflict-item llm-based">
                                <label>LLM推断:</label>
                                <div>置信度: ${conflict.llmBased.confidence || '-'}</div>
                                <div style="font-size: 12px; color: #999; margin-top: 4px;">${conflict.llmBased.description || '-'}</div>
                            </div>
                        </div>
                    `;
                    
                    actionCell = `
                        <button class="btn btn-small btn-secondary" onclick="chooseConflictRule(${index})">选规则</button>
                        <button class="btn btn-small btn-primary" onclick="chooseConflictLLM(${index})">选LLM</button>
                        <button class="btn btn-small btn-danger" onclick="removeAutoDetectItem(${index})">删除</button>
                    `;
                }
                
                return `
                    <tr class="${rowClass}">
                        <td style="padding: 8px;">${sourceCell}</td>
                        <td style="padding: 8px; text-align: center; color: #667eea;">→</td>
                        <td style="padding: 8px;"><strong>${rel.targetTable}</strong>.${rel.targetColumn}</td>
                        <td style="padding: 8px; font-size: 13px; color: #666;">${descriptionCell}</td>
                        <td style="padding: 8px; text-align: center;">${actionCell}</td>
                    </tr>
                `;
            }).join('');
            
            tbody.innerHTML = html;
            updateTotalCount();
            console.log('[renderAutoDetectTable] 渲染完成，共', relationships.length, '条，其中', conflicts.length, '条冲突');
        }
        
        // ✅ 选择规则引擎的结果
        function chooseConflictRule(index) {
            const conflicts = window.autoDetectConflicts || [];
            const rel = window.autoDetectedRelationships[index];
            const key = `${rel.sourceTable}.${rel.sourceColumn}->${rel.targetTable}.${rel.targetColumn}`;
            
            const conflict = conflicts.find(c => c.key === key);
            if (conflict && conflict.ruleBased) {
                // 替换为规则引擎的结果
                window.autoDetectedRelationships[index] = conflict.ruleBased;
                renderAutoDetectTable();
            }
        }
        
        // ✅ 选择LLM推断的结果
        function chooseConflictLLM(index) {
            const conflicts = window.autoDetectConflicts || [];
            const rel = window.autoDetectedRelationships[index];
            const key = `${rel.sourceTable}.${rel.sourceColumn}->${rel.targetTable}.${rel.targetColumn}`;
            
            const conflict = conflicts.find(c => c.key === key);
            if (conflict && conflict.llmBased) {
                // 替换为LLM推断的结果
                window.autoDetectedRelationships[index] = conflict.llmBased;
                renderAutoDetectTable();
            }
        }
        
        // ✅ 更新总数
        function updateTotalCount() {
            const count = (window.autoDetectedRelationships || []).length;
            const conflictCount = (window.autoDetectConflicts || []).length;
            
            let text = `共 ${count} 条关联关系`;
            if (conflictCount > 0) {
                text += `（⚠️ ${conflictCount} 条冲突待确认）`;
            }
            
            // ✅ 更新主页面的计数
            const totalCountEl = document.getElementById('totalCount');
            if (totalCountEl) {
                totalCountEl.textContent = text;
            }
            
            // ✅ 更新自动推断模态框的计数
            const autoDetectTotalEl = document.getElementById('autoDetectTotalCount');
            if (autoDetectTotalEl) {
                autoDetectTotalEl.textContent = `共 ${count} 条`;
            }
            
            // ✅ 更新冲突计数
            const conflictCountEl = document.getElementById('conflictCount');
            if (conflictCountEl) {
                if (conflictCount > 0) {
                    conflictCountEl.style.display = 'inline';
                    conflictCountEl.textContent = `⚠️ 冲突 ${conflictCount} 条`;
                } else {
                    conflictCountEl.style.display = 'none';
                }
            }
        }
        
        // ✅ 删除单行
        function removeAutoDetectItem(index) {
            if (window.autoDetectedRelationships) {
                window.autoDetectedRelationships.splice(index, 1);
                renderAutoDetectTable();
            }
        }
        
        // 关闭自动推断模态框
        function closeAutoDetectModal() {
            // ✅ 直接在 iframe 内部隐藏模态框
            const overlay = document.getElementById('autoDetectModalOverlay');
            if (overlay) {
                overlay.style.display = 'none';
            }
            window.autoDetectedRelationships = null;
            window.autoDetectConflicts = null;
        }
        
        // 保存自动推断的关联关系（含冲突二次确认）
        async function saveAutoDetectedRelationships() {
            if (!window.autoDetectedRelationships || window.autoDetectedRelationships.length === 0) {
                alert('没有可保存的关联关系');
                return;
            }
            
            // ✅ 检查是否有未解决的冲突
            const unresolvedConflicts = checkUnresolvedConflicts();
            if (unresolvedConflicts.length > 0) {
                const confirmed = await showConflictConfirmModal(unresolvedConflicts);
                if (!confirmed) {
                    return; // 用户取消
                }
            }
            
            try {
                // ✅ 直接保存表格中所有数据
                const relationships = window.autoDetectedRelationships.map(rel => ({
                    datasourceId: parseInt(currentDatasourceId),
                    sourceTable: rel.sourceTable,
                    sourceColumn: rel.sourceColumn,
                    targetTable: rel.targetTable,
                    targetColumn: rel.targetColumn,
                    relationshipType: rel.relationship_type || 'MANY_TO_ONE',
                    confidence: rel.confidence || 0.8,
                    description: rel.description || `${rel.sourceTable}通过${rel.sourceColumn}关联${rel.targetTable}`
                }));
                
                const response = await fetch('/api/relationships/batch-save', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ relationships })
                });
                const result = await response.json();
                
                if (result.code === 200) {
                    alert(`成功保存 ${relationships.length} 条关联关系`);
                    closeAutoDetectModal();
                    loadRelationships();
                } else {
                    alert(result.message || '保存失败');
                }
            } catch (error) {
                console.error('保存失败:', error);
                alert('保存失败: ' + error.message);
            }
        }
        
        // ✅ 检查未解决的冲突
        function checkUnresolvedConflicts() {
            const conflicts = window.autoDetectConflicts || [];
            const relationships = window.autoDetectedRelationships || [];
            
            const unresolved = [];
            
            conflicts.forEach(conflict => {
                // 查找当前表格中是否还有该冲突项
                const found = relationships.find(rel => {
                    const key = `${rel.sourceTable}.${rel.sourceColumn}->${rel.targetTable}.${rel.targetColumn}`;
                    return key === conflict.key;
                });
                
                if (found) {
                    // 检查是否与规则引擎或LLM的结果一致
                    const isRuleMatch = JSON.stringify(found) === JSON.stringify(conflict.ruleBased);
                    const isLLMMatch = JSON.stringify(found) === JSON.stringify(conflict.llmBased);
                    
                    if (!isRuleMatch && !isLLMMatch) {
                        unresolved.push(conflict);
                    }
                }
            });
            
            return unresolved;
        }
        
        // ✅ 显示冲突确认模态框
        function showConflictConfirmModal(unresolvedConflicts) {
            return new Promise((resolve) => {
                // ✅ 动态创建冲突确认对话框
                const overlay = document.createElement('div');
                overlay.style.cssText = `
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    background: rgba(0,0,0,0.6);
                    z-index: 100000;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                `;
                
                const conflictRows = unresolvedConflicts.map((conflict, idx) => `
                    <tr>
                        <td style="padding: 12px;">
                            <strong>${conflict.ruleBased.sourceTable || conflict.llmBased.sourceTable}</strong>.
                            ${conflict.ruleBased.sourceColumn || conflict.llmBased.sourceColumn}
                            →
                            <strong>${conflict.ruleBased.targetTable || conflict.llmBased.targetTable}</strong>.
                            ${conflict.ruleBased.targetColumn || conflict.llmBased.targetColumn}
                        </td>
                        <td style="padding: 12px;">
                            <div class="radio-group">
                                <label class="radio-option">
                                    <input type="radio" name="conflict_${idx}" value="rule" checked>
                                    <span>规则引擎</span>
                                </label>
                                <label class="radio-option">
                                    <input type="radio" name="conflict_${idx}" value="llm">
                                    <span>LLM推断</span>
                                </label>
                            </div>
                        </td>
                    </tr>
                `).join('');
                
                overlay.innerHTML = `
                    <div style="background: white; border-radius: 12px; width: 90%; max-width: 800px; max-height: 80vh; overflow-y: auto;">
                        <div style="padding: 20px 24px; border-bottom: 1px solid #e0e0e0;">
                            <h2 style="margin: 0; font-size: 18px; color: #333;">⚠️ 发现 ${unresolvedConflicts.length} 个未解决冲突</h2>
                            <p style="margin: 8px 0 0; color: #666; font-size: 14px;">请选择每个冲突的最终方案：</p>
                        </div>
                        <div style="padding: 24px;">
                            <table class="conflict-table">
                                <thead>
                                    <tr>
                                        <th>关联关系</th>
                                        <th>选择方案</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${conflictRows}
                                </tbody>
                            </table>
                        </div>
                        <div style="padding: 16px 24px; border-top: 1px solid #e0e0e0; display: flex; justify-content: flex-end; gap: 12px;">
                            <button id="cancelConflictBtn" class="btn btn-cancel">取消</button>
                            <button id="confirmConflictBtn" class="btn btn-primary">确认并保存</button>
                        </div>
                    </div>
                `;
                
                document.body.appendChild(overlay);
                
                // ✅ 绑定事件
                document.getElementById('cancelConflictBtn').onclick = () => {
                    document.body.removeChild(overlay);
                    resolve(false);
                };
                
                document.getElementById('confirmConflictBtn').onclick = () => {
                    // ✅ 应用用户选择
                    applyConflictChoices(unresolvedConflicts);
                    document.body.removeChild(overlay);
                    resolve(true);
                };
            });
        }
        
        // ✅ 应用用户的冲突选择
        function applyConflictChoices(unresolvedConflicts) {
            const relationships = window.autoDetectedRelationships || [];
            
            unresolvedConflicts.forEach((conflict, idx) => {
                const selected = document.querySelector(`input[name="conflict_${idx}"]:checked`).value;
                const chosenData = selected === 'rule' ? conflict.ruleBased : conflict.llmBased;
                
                // 在表格中找到对应的项并替换
                const index = relationships.findIndex(rel => {
                    const key = `${rel.sourceTable}.${rel.sourceColumn}->${rel.targetTable}.${rel.targetColumn}`;
                    return key === conflict.key;
                });
                
                if (index >= 0) {
                    relationships[index] = chosenData;
                }
            });
            
            // 重新渲染表格
            renderAutoDetectTable();
        }
    </script>
</body>
</html>
